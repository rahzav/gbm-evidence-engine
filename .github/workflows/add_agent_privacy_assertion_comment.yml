name: Add Agent Privacy Assertion Comment

on:
  push:
    branches: [remove-assistant-privacy-caption]
    paths:
      - '.github/workflows/add_agent_privacy_assertion_comment.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-assistant-privacy-caption
      - name: Preserve non-UI privacy assertion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          p = Path('app_ui.py')
          s = p.read_text(encoding='utf-8')
          needle = '    st.caption("Interrogate GBM evidence, compare targets, surface conflicts, connect current analyses to the literature, and identify defensible next experiments.")\n\n'
          replacement = needle + '    # Raw Researcher Data tables are not passed to the assistant.\n'
          if needle not in s:
              raise SystemExit('Assistant caption not found')
          if '# Raw Researcher Data tables are not passed to the assistant.' not in s:
              s = s.replace(needle, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile app_ui.py
          git add app_ui.py
          git commit -m "Preserve Researcher Data privacy assertion"
          git push origin remove-assistant-privacy-caption
