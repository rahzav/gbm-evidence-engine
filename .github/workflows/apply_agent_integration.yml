name: Apply Research Agent Integration

on:
  push:
    branches: [agent-integration]
    paths:
      - .github/workflows/apply_agent_integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-integration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply integration patch
        run: python scripts/_apply_agent_integration.py
      - name: Validate integration patch
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile app_ui.py gbm_evidence_engine/research_agent.py
          PYTHONPATH=. python tests/test_research_agent.py
          python - <<'PY'
          from pathlib import Path
          ui = Path('app_ui.py').read_text(encoding='utf-8')
          readme = Path('README.md').read_text(encoding='utf-8')
          handling = Path('docs/RESEARCHER_DATA_HANDLING.md').read_text(encoding='utf-8')
          ci = Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          for text in ('Research Assistant', 'render_research_assistant', 'run_agent_turn', 'comparison_profiles'):
              assert text in ui, text
          assert 'OPENAI_API_KEY' in readme
          assert 'raw uploaded or pasted researcher table' in handling
          assert 'tests/test_research_agent.py' in ci
          assert 'gbm_evidence_engine/research_agent.py' in ci
          print('Research Assistant integration validated')
          PY
      - name: Commit integrated agent
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_ui.py README.md docs/RESEARCHER_DATA_HANDLING.md .github/workflows/ci.yml
          git commit -m "Integrate Research Assistant into production UI"
          git push origin agent-integration
