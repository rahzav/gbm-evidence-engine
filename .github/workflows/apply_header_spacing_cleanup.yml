name: Apply Header Spacing Cleanup

on:
  push:
    branches: [header-spacing-cleanup]
    paths:
      - .github/workflows/apply_header_spacing_cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: header-spacing-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tighten header spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app_ui.py')
          text = path.read_text(encoding='utf-8')
          old = 'font-size:.91rem;line-height:1.42;opacity:.68;margin:.42rem 0 0 0;padding:0;'
          new = 'font-size:.91rem;line-height:1.36;opacity:.68;margin:.24rem 0 0 0;padding:0;'
          if old not in text:
              raise SystemExit('research-use spacing block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate spacing patch
        run: |
          python -m py_compile app_ui.py
          python - <<'PY'
          from pathlib import Path
          text = Path('app_ui.py').read_text(encoding='utf-8')
          assert 'font-size:1.04rem;line-height:1.42;opacity:.68;margin:.38rem 0 0 0;padding:0;' in text
          assert 'font-size:.91rem;line-height:1.36;opacity:.68;margin:.24rem 0 0 0;padding:0;' in text
          print('Header spacing validated')
          PY
      - name: Commit spacing change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_ui.py
          git commit -m "Tighten header research-use spacing"
          git push origin header-spacing-cleanup
