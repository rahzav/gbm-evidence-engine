name: Apply Literature Layout Cleanup

on:
  push:
    branches: [literature-layout-cleanup]
    paths:
      - .github/workflows/apply_literature_layout_cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: literature-layout-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace literature explorer layout
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('app_ui.py')
          text = app.read_text(encoding='utf-8')
          start = text.index('def _publication_metadata(paper: dict) -> str:\n')
          end = text.index('\ndef render_translation(ot, trials, bbb):\n', start)
          replacement = Path('scripts/literature_layout_replacement.tmp').read_text(encoding='utf-8')
          app.write_text(text[:start] + replacement + text[end+1:], encoding='utf-8')
          PY
      - name: Validate literature layout
        run: |
          python -m py_compile app_ui.py
          python - <<'PY'
          from pathlib import Path
          text = Path('app_ui.py').read_text(encoding='utf-8')
          assert '### Literature Explorer' in text
          assert '#### Find publications' in text
          assert 'Clear search' not in text
          assert 'on_change=clear_literature_search' not in text
          assert 'Load 25 more' in text
          print('LITERATURE LAYOUT VALIDATED')
          PY
      - name: Commit patch
        run: |
          git config user.name "rahzav"
          git config user.email "rzaveri1770@gmail.com"
          git add app_ui.py
          git commit -m "Clean up literature explorer layout"
          git push origin HEAD:literature-layout-cleanup
