name: Apply Publication Browser Patch

on:
  push:
    branches: [publication-browser-and-citation-fix]
    paths:
      - .github/workflows/apply_publication_browser_patch.yml
      - scripts/apply_publication_browser_patch.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publication-browser-and-citation-fix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_publication_browser_patch.py
      - name: Commit patched production files
        run: |
          git checkout -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_ui.py ui_walkthroughs.py gbm_evidence_engine/connectors/europepmc.py tests/test_europepmc_publications.py
          git commit -m "Fix publication browser and auto-launch feature walkthroughs"
          git push origin publication-browser-and-citation-fix
