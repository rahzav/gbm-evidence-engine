name: Apply UI spacing polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply_ui_spacing.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Streamlit copy and spacing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('streamlit_app.py')
          text = path.read_text()

          old_intro = '''st.write(
              "Enter a gene symbol to generate a structured GBM-specific research profile. The tool integrates TCGA/cBioPortal, Open Targets, ClinicalTrials.gov, Europe PMC, DepMap, Ivy GAP, CGGA, and authorized GLASS data where available. Results are intended for research prioritization and hypothesis development, not clinical decision-making."
          )'''
          new_intro = '''st.write(
              "Enter a gene symbol to generate a GBM-specific research profile. The tool integrates evidence from TCGA/cBioPortal, Open Targets, ClinicalTrials.gov, Europe PMC, DepMap, Ivy GAP, CGGA, and authorized GLASS data where available."
          )
          st.caption(
              "Note: Results are intended for research prioritization and hypothesis development, not clinical decision-making."
          )'''
          if old_intro not in text:
              raise SystemExit('Expected intro block not found')
          text = text.replace(old_intro, new_intro, 1)

          helper_anchor = '''def pval(x):
              if x is None:
                  return "N/A"
              return f"{x:.2g}"
          '''
          helper_replacement = helper_anchor + '''\n\ndef section_space(size: float = 1.35):
              st.markdown(
                  f"<div style='height: {size}rem;'></div>",
                  unsafe_allow_html=True,
              )
          '''
          if 'def section_space(' not in text:
              if helper_anchor not in text:
                  raise SystemExit('Expected pval helper not found')
              text = text.replace(helper_anchor, helper_replacement, 1)

          replacements = [
              (
                  '''        st.caption(f"{score.label}. {score.caveat}")\n\n        st.markdown("### Priority Score Composition")''',
                  '''        st.caption(f"{score.label}. {score.caveat}")\n\n        section_space()\n        st.markdown("### Priority Score Composition")''',
              ),
              (
                  '''        gla = profile.live.get("glass", {})\n\n        st.markdown("### Genomic Evidence")''',
                  '''        gla = profile.live.get("glass", {})\n\n        section_space()\n        st.markdown("### Genomic Evidence")''',
              ),
              (
                  '''        g4.metric("Open Targets Association Score", num(ot.get("gbm_association_score"), 3))\n\n        left, right = st.columns(2)''',
                  '''        g4.metric("Open Targets Association Score", num(ot.get("gbm_association_score"), 3))\n\n        section_space()\n        left, right = st.columns(2)''',
              ),
              (
                  '''            for idea in profile.next_experiments:\n                st.markdown(f"- {idea}")\n\n        detail_tabs = st.tabs([''',
                  '''            for idea in profile.next_experiments:\n                st.markdown(f"- {idea}")\n\n        section_space(1.6)\n        detail_tabs = st.tabs([''',
              ),
              (
                  '''            else:\n                st.info(dep.get("error", "DepMap evidence is unavailable."))\n\n            st.markdown("#### Ivy GAP Spatial Expression")''',
                  '''            else:\n                st.info(dep.get("error", "DepMap evidence is unavailable."))\n\n            section_space(1.0)\n            st.markdown("#### Ivy GAP Spatial Expression")''',
              ),
              (
                  '''            else:\n                st.info("CGGA validation is unavailable in the strict GBM subset.")\n\n            st.markdown("#### GLASS Longitudinal Validation")''',
                  '''            else:\n                st.info("CGGA validation is unavailable in the strict GBM subset.")\n\n            section_space(1.0)\n            st.markdown("#### GLASS Longitudinal Validation")''',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected UI block not found: {old[:70]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit polished UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply_ui_spacing.yml
          git add streamlit_app.py .github/workflows/apply_ui_spacing.yml
          git commit -m "Refine research profile description and spacing"
          git push
