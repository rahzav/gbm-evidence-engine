name: Apply Walkthrough Checkbox Layout

on:
  push:
    branches: [walkthrough-checkbox-placement]
    paths:
      - .github/workflows/apply_walkthrough_checkbox.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: walkthrough-checkbox-placement
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace walkthrough preference control
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ui_walkthroughs.py')
          text = path.read_text(encoding='utf-8')

          old_pref = '''def _suppress_walkthrough(feature: str) -> None:\n    \"\"\"Disable future automatic launches while preserving manual info-button access.\"\"\"\n    st.session_state[_suppressed_key(feature)] = True\n    st.session_state.pop(\"pending_feature_walkthrough\", None)\n'''
          new_pref = '''def _preference_key(feature: str) -> str:\n    return f\"{feature}_walkthrough_do_not_show\"\n\n\ndef _sync_suppression(feature: str) -> None:\n    \"\"\"Sync the visible checkbox with automatic walkthrough behavior.\"\"\"\n    suppressed = bool(st.session_state.get(_preference_key(feature), False))\n    st.session_state[_suppressed_key(feature)] = suppressed\n    if suppressed:\n        st.session_state.pop(\"pending_feature_walkthrough\", None)\n'''
          if old_pref not in text:
              raise SystemExit('preference block not found')
          text = text.replace(old_pref, new_pref, 1)

          start = text.index('def _nav(feature: str, step: int, titles: list[str]) -> None:\n')
          end = text.index('\ndef _intro(feature: str, titles: list[str]) -> int:\n', start)
          new_nav = '''def _nav(feature: str, step: int, titles: list[str]) -> None:\n    st.markdown(\n        \"<div style='text-align:center;letter-spacing:.26rem;opacity:.58;margin:.35rem 0 .15rem;'>\"\n        + \" \".join(\"●\" if i == step else \"○\" for i in range(len(titles)))\n        + \"</div>\",\n        unsafe_allow_html=True,\n    )\n\n    preference_key = _preference_key(feature)\n    st.session_state.setdefault(preference_key, _is_suppressed(feature))\n    preference_col, back_col, next_col = st.columns(\n        [4.6, 1.25, 1.25], vertical_alignment=\"center\"\n    )\n    with preference_col:\n        st.checkbox(\n            \"Don't show this walkthrough again\",\n            key=preference_key,\n            help=\"Stops this walkthrough from opening automatically. You can still open it anytime with the info button.\",\n            on_change=_sync_suppression,\n            args=(feature,),\n        )\n        st.caption(\"You can still reopen it anytime from the info button.\")\n    with back_col:\n        if step > 0:\n            st.button(\n                \"← Previous\",\n                key=f\"{feature}_walkthrough_prev_{step}\",\n                width=\"stretch\",\n                on_click=_move,\n                args=(feature, -1, len(titles)),\n            )\n    with next_col:\n        if step < len(titles) - 1:\n            st.button(\n                \"Next →\",\n                key=f\"{feature}_walkthrough_next_{step}\",\n                type=\"primary\",\n                width=\"stretch\",\n                on_click=_move,\n                args=(feature, 1, len(titles)),\n            )\n        elif st.button(\n            \"Close\",\n            key=f\"{feature}_walkthrough_close\",\n            type=\"primary\",\n            width=\"stretch\",\n        ):\n            st.rerun()\n\n'''
          text = text[:start] + new_nav + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate walkthrough preference UI
        run: |
          python -m py_compile ui_walkthroughs.py
          python - <<'PY'
          from pathlib import Path
          text = Path('ui_walkthroughs.py').read_text()
          assert 'st.checkbox(' in text
          assert "Don't show this walkthrough again" in text
          assert 'You can still reopen it anytime from the info button.' in text
          assert 'type="tertiary"' not in text[text.index('def _nav'):text.index('def _intro')]
          assert '_sync_suppression' in text
          assert '_launch(feature, manual=True)' in text
          print('Walkthrough checkbox UI validated')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui_walkthroughs.py
          git commit -m "Improve walkthrough do-not-show-again control"
          git push origin walkthrough-checkbox-placement

# trigger