name: Apply Walkthrough Suppression

on:
  push:
    branches: [walkthrough-do-not-show-again]
    paths:
      - .github/workflows/apply_walkthrough_suppression.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: walkthrough-do-not-show-again
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add per-walkthrough do-not-show-again behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ui_walkthroughs.py')
          text = path.read_text(encoding='utf-8')

          anchor = '''def _step_key(feature: str) -> str:\n    return f"{feature}_walkthrough_step"\n'''
          addition = '''def _suppressed_key(feature: str) -> str:\n    return f"{feature}_walkthrough_suppressed"\n\n\ndef _is_suppressed(feature: str) -> bool:\n    return bool(st.session_state.get(_suppressed_key(feature), False))\n\n\ndef _suppress_walkthrough(feature: str) -> None:\n    """Disable future automatic launches while preserving manual info-button access."""\n    st.session_state[_suppressed_key(feature)] = True\n    st.session_state.pop("pending_feature_walkthrough", None)\n\n\n'''
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('step-key anchor not found')
              text = text.replace(anchor, addition + anchor, 1)

          old_nav = '''    back_col, _, next_col = st.columns([1.3, 4.4, 1.3], vertical_alignment="center")\n    with back_col:\n        if step > 0:\n            st.button(\n                "← Previous",\n                key=f"{feature}_walkthrough_prev_{step}",\n                width="stretch",\n                on_click=_move,\n                args=(feature, -1, len(titles)),\n            )\n    with next_col:\n'''
          new_nav = '''    back_col, preference_col, next_col = st.columns([1.3, 4.4, 1.3], vertical_alignment="center")\n    with back_col:\n        if step > 0:\n            st.button(\n                "← Previous",\n                key=f"{feature}_walkthrough_prev_{step}",\n                width="stretch",\n                on_click=_move,\n                args=(feature, -1, len(titles)),\n            )\n    with preference_col:\n        st.button(\n            "Don't show again",\n            key=f"{feature}_walkthrough_suppress_{step}",\n            type="tertiary",\n            width="stretch",\n            help="Stops this walkthrough from opening automatically. You can still open it anytime with the info button.",\n            on_click=_suppress_walkthrough,\n            args=(feature,),\n        )\n    with next_col:\n'''
          if old_nav in text:
              text = text.replace(old_nav, new_nav, 1)
          elif new_nav not in text:
              raise SystemExit('navigation anchor not found')

          old_launch = '''def _launch(feature: str) -> None:\n    _reset(feature)\n    if feature == "gene":\n        show_gene_walkthrough()\n    elif feature == "pair":\n        show_pair_walkthrough()\n    elif feature == "researcher":\n        show_researcher_walkthrough()\n    elif feature == "comparison":\n        show_comparison_walkthrough()\n    else:  # defensive programming for future UI additions\n        raise ValueError(f"Unknown walkthrough feature: {feature}")\n'''
          new_launch = '''def _launch(feature: str, *, manual: bool = False) -> None:\n    if not manual and _is_suppressed(feature):\n        return\n    _reset(feature)\n    if feature == "gene":\n        show_gene_walkthrough()\n    elif feature == "pair":\n        show_pair_walkthrough()\n    elif feature == "researcher":\n        show_researcher_walkthrough()\n    elif feature == "comparison":\n        show_comparison_walkthrough()\n    else:  # defensive programming for future UI additions\n        raise ValueError(f"Unknown walkthrough feature: {feature}")\n'''
          if old_launch in text:
              text = text.replace(old_launch, new_launch, 1)
          elif new_launch not in text:
              raise SystemExit('launch anchor not found')

          old_change = '''def on_workflow_tab_change() -> None:\n    """Queue the selected workflow's walkthrough whenever its tab is opened."""\n    label = st.session_state.get("research_workflow_tabs")\n    feature = WORKFLOW_TAB_TO_FEATURE.get(label)\n    if feature:\n        st.session_state["pending_feature_walkthrough"] = feature\n'''
          new_change = '''def on_workflow_tab_change() -> None:\n    """Queue the selected workflow's walkthrough unless automatic display was disabled."""\n    label = st.session_state.get("research_workflow_tabs")\n    feature = WORKFLOW_TAB_TO_FEATURE.get(label)\n    if feature and not _is_suppressed(feature):\n        st.session_state["pending_feature_walkthrough"] = feature\n    else:\n        st.session_state.pop("pending_feature_walkthrough", None)\n'''
          if old_change in text:
              text = text.replace(old_change, new_change, 1)
          elif new_change not in text:
              raise SystemExit('tab-change anchor not found')

          old_info = '''        ):\n            _launch(feature)\n    if caption:\n        st.caption(caption)\n\n\ndef maybe_show_initial_gene_walkthrough() -> None:\n'''
          new_info = '''        ):\n            _launch(feature, manual=True)\n    if caption:\n        st.caption(caption)\n\n\ndef maybe_show_initial_gene_walkthrough() -> None:\n'''
          if old_info in text:
              text = text.replace(old_info, new_info, 1)
          elif new_info not in text:
              raise SystemExit('info-button anchor not found')

          old_initial = '''def maybe_show_initial_gene_walkthrough() -> None:\n    """Preserve the first-use Gene Analysis tour without forcing other tours."""\n    if "gene_walkthrough_seen" not in st.session_state:\n        st.session_state["gene_walkthrough_seen"] = True\n        _reset("gene")\n        show_gene_walkthrough()\n'''
          new_initial = '''def maybe_show_initial_gene_walkthrough() -> None:\n    """Show the first-use Gene Analysis tour unless the user disabled automatic display."""\n    if "gene_walkthrough_seen" not in st.session_state:\n        st.session_state["gene_walkthrough_seen"] = True\n        if not _is_suppressed("gene"):\n            _reset("gene")\n            show_gene_walkthrough()\n'''
          if old_initial in text:
              text = text.replace(old_initial, new_initial, 1)
          elif new_initial not in text:
              raise SystemExit('initial-gene anchor not found')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate walkthrough behavior
        run: |
          python -m py_compile ui_walkthroughs.py
          grep -q 'Don.t show again' ui_walkthroughs.py
          grep -q '_launch(feature, manual=True)' ui_walkthroughs.py
          grep -q 'not _is_suppressed(feature)' ui_walkthroughs.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui_walkthroughs.py
          if ! git diff --cached --quiet; then
            git commit -m 'Add do-not-show-again option to walkthroughs'
            git push
          fi
