name: Bootstrap project

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for bootstrap archive
        id: check
        run: |
          if [ -f _bootstrap/part01.b64 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct source archive
        if: steps.check.outputs.run == 'true'
        run: |
          cat _bootstrap/part*.b64 | base64 -d > /tmp/project.tar.xz
          mkdir -p /tmp/project
          tar -xJf /tmp/project.tar.xz -C /tmp/project
          cp -a /tmp/project/gbm-evidence-engine/. .

      - uses: actions/setup-python@v5
        if: steps.check.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Generate deterministic demo data
        if: steps.check.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy
          PYTHONPATH=. python scripts/generate_synthetic_reference_data.py
          PYTHONPATH=. python scripts/run_demo_dossier.py EGFR

      - name: Run validation tests
        if: steps.check.outputs.run == 'true'
        run: |
          PYTHONPATH=. python tests/test_survival.py
          PYTHONPATH=. python tests/test_dependency.py
          PYTHONPATH=. python tests/test_evidence_model.py
          PYTHONPATH=. python tests/test_grounding_validator.py

      - name: Commit imported project
        if: steps.check.outputs.run == 'true'
        run: |
          rm -rf _bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import GBM Evidence Engine project"
          git push
