name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  production-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax validation
        run: |
          python -m py_compile \
            gbm_evidence_engine/connectors/*.py \
            gbm_evidence_engine/research_intelligence.py \
            gbm_evidence_engine/research_intelligence_v3.py \
            gbm_evidence_engine/research_intelligence_v4.py \
            gbm_evidence_engine/research_intelligence_v5.py \
            gbm_evidence_engine/research_intelligence_v6.py \
            gbm_evidence_engine/research_discovery.py \
            gbm_evidence_engine/research_intelligence_v7.py \
            gbm_evidence_engine/research_intelligence_v7_prod.py \
            gbm_evidence_engine/benchmarking.py \
            app_ui.py ui_walkthroughs.py streamlit_app.py api/app.py
      - name: Scientific and grounding tests
        run: |
          PYTHONPATH=. python tests/test_survival.py
          PYTHONPATH=. python tests/test_dependency.py
          PYTHONPATH=. python tests/test_evidence_model.py
          PYTHONPATH=. python tests/test_grounding_validator.py
          PYTHONPATH=. python tests/test_research_intelligence.py
          PYTHONPATH=. python tests/test_research_intelligence_v3.py
          PYTHONPATH=. python tests/test_glass_gbm_specific.py
          PYTHONPATH=. python tests/test_research_intelligence_v5.py
          PYTHONPATH=. python tests/test_research_intelligence_v6.py
          PYTHONPATH=. python tests/test_research_discovery.py
          PYTHONPATH=. python tests/test_research_intelligence_v7.py
          PYTHONPATH=. python tests/test_europepmc_publications.py
      - name: Validate native GBmap reference
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from gbm_evidence_engine.connectors.gbmap import summarize_gene

          data = Path('data/gbmap_gene_state_summary.csv.gz')
          metadata = Path('data/gbmap_reference_metadata.json')
          assert data.exists(), data
          assert metadata.exists(), metadata
          assert data.stat().st_size < 95_000_000, data.stat().st_size
          meta = json.loads(metadata.read_text())
          assert meta['n_cells'] >= 300000, meta
          assert meta['n_patients'] >= 100, meta
          assert meta['n_states'] >= 10, meta
          assert meta['reference_schema_version'] == '1.2.0', meta
          for gene in ['EGFR', 'SOX2', 'OLIG2', 'GFAP', 'CDK4', 'PTEN']:
              result = summarize_gene(gene)
              assert result.get('ok'), (gene, result)
              assert result.get('states'), (gene, result)
          ambiguous = summarize_gene('PINX1')
          assert ambiguous.get('status') == 'ambiguous_gene_symbol', ambiguous
          print('NATIVE GBMAP OK')
          PY
      - name: Validate benchmark framework
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from gbm_evidence_engine.benchmarking import load_manifest

          manifest = load_manifest()
          classes = {case['case_class'] for case in manifest['cases']}
          assert {'known_positive', 'known_negative', 'context_specific'} <= classes, classes
          counts = {name: sum(c['case_class'] == name for c in manifest['cases']) for name in classes}
          assert counts.get('known_positive', 0) >= 1, counts
          assert counts.get('known_negative', 0) >= 1, counts
          assert counts.get('context_specific', 0) >= 1, counts
          assert all(case['mode'] == 'current_behavior_regression' for case in manifest['cases'])
          registry = json.loads(Path('data/prospective_registry.json').read_text())
          assert registry['registrations'] == [], registry
          print('BENCHMARK FRAMEWORK OK', counts)
          PY
      - name: Validate single production presentation path
        run: |
          PYTHONPATH=. python - <<'PY'
          from pathlib import Path

          versioned_ui = sorted(str(p) for p in Path('.').glob('streamlit_app_v*.py'))
          assert versioned_ui == [], versioned_ui
          entry = Path('streamlit_app.py').read_text(encoding='utf-8')
          assert 'app_ui.py' in entry, entry
          ui = Path('app_ui.py').read_text(encoding='utf-8')
          walkthroughs = Path('ui_walkthroughs.py').read_text(encoding='utf-8')
          for required in ('Build dossier', 'Gene Analysis', 'Target Pair Analysis', 'Researcher Data', 'Gene Set Comparison'):
              assert required in ui, required
          assert 'research_intelligence_v7_prod' in ui
          assert 'Integrated gene-level evidence synthesis for glioblastoma research, updated in real time.' in ui
          assert 'Search publications' in ui
          assert 'Load 25 more' in ui
          assert 'on_change=on_workflow_tab_change' in ui
          assert 'def show_walkthrough()' not in ui
          for function_name in (
              'show_gene_walkthrough',
              'show_pair_walkthrough',
              'show_researcher_walkthrough',
              'show_comparison_walkthrough',
              'on_workflow_tab_change',
              'maybe_show_active_walkthrough',
          ):
              assert f'def {function_name}' in walkthroughs, function_name
          print('SINGLE PRODUCTION UI + PUBLICATION BROWSER + FEATURE WALKTHROUGHS OK')
          PY
      - name: Validate release metadata and documentation
        run: |
          PYTHONPATH=. python - <<'PY'
          from pathlib import Path
          import gbm_evidence_engine.research_intelligence_v7_prod as prod

          assert prod.SOFTWARE_VERSION == '7.0.0'
          for path in ['LICENSE', 'CITATION.cff', 'docs/METHODS.md', 'docs/RESEARCHER_DATA_HANDLING.md', 'docs/RELEASE_VALIDATION.md']:
              assert Path(path).exists(), path
          citation = Path('CITATION.cff').read_text(encoding='utf-8')
          assert 'version: "7.0.0"' in citation
          readme = Path('README.md').read_text(encoding='utf-8')
          assert 'Software release: 7.0.0' in readme
          print('RELEASE METADATA OK')
          PY
      - name: Streamlit product smoke test
        run: |
          python - <<'PY'
          from pathlib import Path
          from streamlit.testing.v1 import AppTest

          ui = Path('app_ui.py').read_text()
          assert 'use_container_width=' not in ui
          for required in ('Build dossier', 'Gene Analysis', 'Target Pair Analysis', 'Researcher Data', 'Gene Set Comparison'):
              assert required in ui, required
          at = AppTest.from_file('streamlit_app.py', default_timeout=60).run(timeout=30)
          if at.exception:
              raise SystemExit(at.exception)
          assert any(button.label == 'Build dossier' for button in at.button)
          assert bool(at.session_state['gene_walkthrough_seen'])
          assert at.session_state['research_workflow_tabs'] == 'Gene Analysis'
          print('STREAMLIT PRODUCT OK')
          PY
      - name: API and invalid-input contracts
        run: |
          PYTHONPATH=. python - <<'PY'
          from fastapi.testclient import TestClient
          from api.app import app, health

          result = health()
          assert result['status'] == 'ok', result
          assert result['version'] == '7.0.0', result

          client = TestClient(app)
          same = client.post('/combination', json={'gene_a': 'EGFR', 'gene_b': 'EGFR'})
          assert same.status_code == 400, same.text
          mismatch = client.post('/signature', json={'genes': ['A','B','C','D','E','F'], 'values': [1,2,3,4,5,6], 'p_values': [0.1]})
          assert mismatch.status_code == 400, mismatch.text
          too_empty = client.post('/profile', json={'gene': ''})
          assert too_empty.status_code == 422, too_empty.text
          print('API 7.0.0 + INVALID INPUT CONTRACTS OK')
          PY
