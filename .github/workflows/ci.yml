name: CI

on:
  push:
    branches: [main, research-grade-cohorts, v5-research-capacity, fix-streamlit-rerun]
  pull_request:

permissions:
  contents: write

jobs:
  scientific-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Streamlit rerun fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          p = Path('streamlit_app_v5.py')
          text = p.read_text()
          page_config = 'st.set_page_config(page_title="GBM Gene Analysis", page_icon="🧬", layout="wide")\n\n'
          if page_config not in text:
              raise SystemExit('Page config marker not found')
          text = text.replace(page_config, '', 1)

          marker = 'st.title("GBM Gene Analysis")\n'
          if marker not in text:
              raise SystemExit('UI marker not found')
          head, body = text.split(marker, 1)
          ui = marker + body
          wrapped = (
              head.rstrip()
              + '\n\n\ndef main():\n'
              + '    st.set_page_config(page_title="GBM Gene Analysis", page_icon="🧬", layout="wide")\n\n'
              + textwrap.indent(ui, '    ')
              + '\n\n\nif __name__ == "__main__":\n    main()\n'
          )
          p.write_text(wrapped)

          Path('streamlit_app.py').write_text(
              '"""Streamlit entrypoint for GBM Gene Analysis."""\n'
              'from streamlit_app_v5 import main\n\n'
              'main()\n'
          )

          p = Path('streamlit_app_v5.py')
          text = p.read_text()
          text = text.replace(
              '@st.cache_data(ttl=3600, show_spinner=False)\ndef cached_profile',
              '@st.cache_data(ttl=3600, max_entries=8, show_spinner=False)\ndef cached_profile',
              1,
          )
          text = text.replace(
              '@st.cache_data(ttl=3600, show_spinner=False)\ndef cached_batch',
              '@st.cache_data(ttl=3600, max_entries=3, show_spinner=False)\ndef cached_batch',
              1,
          )
          p.write_text(text)

          Path('tests/test_streamlit_rerun.py').write_text('''"""Regression test: Streamlit entrypoint must render after widget reruns."""\nfrom pathlib import Path\nfrom streamlit.testing.v1 import AppTest\n\nAPP_PATH = Path(__file__).resolve().parents[1] / "streamlit_app.py"\n\n\ndef _has_title(at):\n    return any(getattr(item, "value", None) == "GBM Gene Analysis" for item in at.title)\n\n\ndef test_entrypoint_rerenders_after_widget_change():\n    at = AppTest.from_file(APP_PATH, default_timeout=20).run(timeout=20)\n    assert not list(at.exception), list(at.exception)\n    assert _has_title(at)\n    gene = next(w for w in at.text_input if w.label == "Gene symbol")\n    gene.set_value("PTEN").run(timeout=20)\n    assert not list(at.exception), list(at.exception)\n    assert _has_title(at), "Entrypoint went blank after Streamlit rerun"\n\n\nif __name__ == "__main__":\n    test_entrypoint_rerenders_after_widget_change()\n    print("STREAMLIT RERUN REGRESSION TEST PASSED")\n''')
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy streamlit==1.63.0

      - name: Syntax validation
        run: |
          python -m py_compile \
            gbm_evidence_engine/connectors/base.py \
            gbm_evidence_engine/connectors/cbioportal.py \
            gbm_evidence_engine/connectors/opentargets.py \
            gbm_evidence_engine/connectors/europepmc.py \
            gbm_evidence_engine/connectors/clinicaltrials.py \
            gbm_evidence_engine/connectors/depmap.py \
            gbm_evidence_engine/connectors/ivygap.py \
            gbm_evidence_engine/connectors/cgga.py \
            gbm_evidence_engine/connectors/glass.py \
            gbm_evidence_engine/connectors/mygene.py \
            gbm_evidence_engine/connectors/hpa.py \
            gbm_evidence_engine/connectors/stringdb.py \
            gbm_evidence_engine/connectors/b3db_live.py \
            gbm_evidence_engine/research_intelligence.py \
            gbm_evidence_engine/research_intelligence_v3.py \
            gbm_evidence_engine/research_intelligence_v4.py \
            gbm_evidence_engine/research_intelligence_v5.py \
            streamlit_app.py streamlit_app_v5.py api/app.py \
            tests/test_streamlit_rerun.py

      - name: Scientific, grounding and rerun tests
        run: |
          PYTHONPATH=. python tests/test_survival.py
          PYTHONPATH=. python tests/test_dependency.py
          PYTHONPATH=. python tests/test_evidence_model.py
          PYTHONPATH=. python tests/test_grounding_validator.py
          PYTHONPATH=. python tests/test_research_intelligence.py
          PYTHONPATH=. python tests/test_research_intelligence_v3.py
          PYTHONPATH=. python tests/test_glass_gbm_specific.py
          PYTHONPATH=. python tests/test_research_intelligence_v5.py
          PYTHONPATH=. python tests/test_streamlit_rerun.py

      - name: Full Build Research Profile button test
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          at = AppTest.from_file('streamlit_app.py', default_timeout=180).run(timeout=30)
          assert not list(at.exception), list(at.exception)
          button = next(b for b in at.button if b.label == 'Build Research Profile')
          button.click().run(timeout=180)
          assert not list(at.exception), list(at.exception)
          assert any(m.label == 'Target Priority Score' for m in at.metric), 'Profile metrics did not render after button click'
          assert any(getattr(item, 'value', None) == 'GBM Gene Analysis' for item in at.title), 'App went blank after profile build'
          print('FULL STREAMLIT BUTTON TEST PASSED')
          PY

      - name: Commit validated fix
        if: github.ref == 'refs/heads/fix-streamlit-rerun'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches: [main, research-grade-cohorts, v5-research-capacity]
            pull_request:

          jobs:
            scientific-validation:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - name: Install scientific and Streamlit test dependencies
                  run: |
                    python -m pip install --upgrade pip
                    pip install numpy pandas scipy streamlit==1.63.0
                - name: Syntax validation
                  run: |
                    python -m py_compile \
                      gbm_evidence_engine/connectors/base.py \
                      gbm_evidence_engine/connectors/cbioportal.py \
                      gbm_evidence_engine/connectors/opentargets.py \
                      gbm_evidence_engine/connectors/europepmc.py \
                      gbm_evidence_engine/connectors/clinicaltrials.py \
                      gbm_evidence_engine/connectors/depmap.py \
                      gbm_evidence_engine/connectors/ivygap.py \
                      gbm_evidence_engine/connectors/cgga.py \
                      gbm_evidence_engine/connectors/glass.py \
                      gbm_evidence_engine/connectors/mygene.py \
                      gbm_evidence_engine/connectors/hpa.py \
                      gbm_evidence_engine/connectors/stringdb.py \
                      gbm_evidence_engine/connectors/b3db_live.py \
                      gbm_evidence_engine/research_intelligence.py \
                      gbm_evidence_engine/research_intelligence_v3.py \
                      gbm_evidence_engine/research_intelligence_v4.py \
                      gbm_evidence_engine/research_intelligence_v5.py \
                      streamlit_app.py streamlit_app_v5.py api/app.py \
                      tests/test_streamlit_rerun.py
                - name: Scientific, grounding and Streamlit rerun tests
                  run: |
                    PYTHONPATH=. python tests/test_survival.py
                    PYTHONPATH=. python tests/test_dependency.py
                    PYTHONPATH=. python tests/test_evidence_model.py
                    PYTHONPATH=. python tests/test_grounding_validator.py
                    PYTHONPATH=. python tests/test_research_intelligence.py
                    PYTHONPATH=. python tests/test_research_intelligence_v3.py
                    PYTHONPATH=. python tests/test_glass_gbm_specific.py
                    PYTHONPATH=. python tests/test_research_intelligence_v5.py
                    PYTHONPATH=. python tests/test_streamlit_rerun.py
          YAML
          git add streamlit_app.py streamlit_app_v5.py tests/test_streamlit_rerun.py .github/workflows/ci.yml
          git commit -m "Fix Streamlit blank reruns after interactions"
          git push origin HEAD:fix-streamlit-rerun
