name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  production-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax validation
        run: |
          python -m py_compile \
            gbm_evidence_engine/connectors/*.py \
            gbm_evidence_engine/research_intelligence.py \
            gbm_evidence_engine/research_intelligence_v3.py \
            gbm_evidence_engine/research_intelligence_v4.py \
            gbm_evidence_engine/research_intelligence_v5.py \
            gbm_evidence_engine/research_intelligence_v6.py \
            gbm_evidence_engine/research_discovery.py \
            gbm_evidence_engine/research_intelligence_v7.py \
            gbm_evidence_engine/research_intelligence_v7_prod.py \
            gbm_evidence_engine/benchmarking.py \
            app_ui.py streamlit_app.py api/app.py
      - name: Scientific and grounding tests
        run: |
          PYTHONPATH=. python tests/test_survival.py
          PYTHONPATH=. python tests/test_dependency.py
          PYTHONPATH=. python tests/test_evidence_model.py
          PYTHONPATH=. python tests/test_grounding_validator.py
          PYTHONPATH=. python tests/test_research_intelligence.py
          PYTHONPATH=. python tests/test_research_intelligence_v3.py
          PYTHONPATH=. python tests/test_glass_gbm_specific.py
          PYTHONPATH=. python tests/test_research_intelligence_v5.py
          PYTHONPATH=. python tests/test_research_intelligence_v6.py
          PYTHONPATH=. python tests/test_research_discovery.py
          PYTHONPATH=. python tests/test_research_intelligence_v7.py
      - name: Validate native GBmap reference
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from gbm_evidence_engine.connectors.gbmap import summarize_gene

          data = Path('data/gbmap_gene_state_summary.csv.gz')
          metadata = Path('data/gbmap_reference_metadata.json')
          assert data.exists(), data
          assert metadata.exists(), metadata
          assert data.stat().st_size < 95_000_000, data.stat().st_size
          meta = json.loads(metadata.read_text())
          assert meta['n_cells'] >= 300000, meta
          assert meta['n_patients'] >= 100, meta
          assert meta['n_states'] >= 10, meta
          assert meta['reference_schema_version'] == '1.2.0', meta
          for gene in ['EGFR', 'SOX2', 'OLIG2', 'GFAP', 'CDK4', 'PTEN']:
              result = summarize_gene(gene)
              assert result.get('ok'), (gene, result)
              assert result.get('states'), (gene, result)
          ambiguous = summarize_gene('PINX1')
          assert ambiguous.get('status') == 'ambiguous_gene_symbol', ambiguous
          print('NATIVE GBMAP OK')
          PY
      - name: Validate benchmark framework
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from gbm_evidence_engine.benchmarking import load_manifest

          manifest = load_manifest()
          classes = {case['case_class'] for case in manifest['cases']}
          assert {'known_positive', 'known_negative', 'context_specific'} <= classes, classes
          assert all(case['mode'] == 'current_behavior_regression' for case in manifest['cases'])
          registry = json.loads(Path('data/prospective_registry.json').read_text())
          assert registry['registrations'] == [], registry
          print('BENCHMARK FRAMEWORK OK')
          PY
      - name: Streamlit product smoke test
        run: |
          python - <<'PY'
          from pathlib import Path
          from streamlit.testing.v1 import AppTest

          ui = Path('app_ui.py').read_text()
          assert 'use_container_width=' not in ui
          for required in ('Build dossier', 'Gene Analysis', 'Target Pair Analysis', 'Researcher Data', 'Gene Set Comparison'):
              assert required in ui, required
          at = AppTest.from_file('streamlit_app.py', default_timeout=60).run(timeout=30)
          if at.exception:
              raise SystemExit(at.exception)
          assert any(button.label == 'Build dossier' for button in at.button)
          assert at.session_state['walkthrough_open'] is True
          print('STREAMLIT PRODUCT OK')
          PY
      - name: API contract
        run: |
          PYTHONPATH=. python - <<'PY'
          from api.app import health
          result = health()
          assert result['status'] == 'ok', result
          assert result['version'] == '7.0.0', result
          print('API V7 OK')
          PY
