name: V7 Production Audit

on:
  push:
    branches: [v7-frozen-scope]
  pull_request:

permissions:
  contents: write

jobs:
  production-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v7-frozen-scope
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply targeted production fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('gbm_evidence_engine/research_intelligence_v7.py')
          t = p.read_text()
          start = t.index('\ndef evaluate_gene_pair(')
          end = t.index('\ndef _clean_signature(', start)
          new_pair = r'''
def evaluate_gene_pair(gene_a: str, gene_b: str) -> dict:
    """Evaluate a two-target experiment from exactly two V7 profiles.

    This is a rationale-for-testing heuristic, not a pharmacologic-synergy,
    efficacy, safety, or clinical prediction.
    """
    a_raw, b_raw = gene_a.strip(), gene_b.strip()
    if not a_raw or not b_raw:
        raise ValueError("Enter two gene symbols.")
    if a_raw.upper() == b_raw.upper():
        raise ValueError("Combination analysis requires two different genes.")

    # Each complete target profile is built exactly once. Sequential execution
    # keeps peak Community Cloud resource pressure bounded.
    a = build_research_profile(a_raw)
    b = build_research_profile(b_raw)

    def dim(profile, name):
        value = profile.score.dimensions.get(name)
        return _num(getattr(value, "score", None)) if value is not None else None

    score_a = float(a.score.overall or 0.0)
    score_b = float(b.score.overall or 0.0)
    target_quality = (score_a + score_b) / 2.0

    dep_a, dep_b = a.live.get("depmap", {}), b.live.get("depmap", {})
    da, db = dim(a, "Functional dependency"), dim(b, "Functional dependency")
    if da is None or db is None:
        functional = None
    else:
        functional = (da + db) / 2.0
        if dep_a.get("pan_essential") or dep_b.get("pan_essential"):
            functional *= 0.65

    def network_set(profile):
        out = {profile.gene.upper()}
        for row in profile.live.get("interaction_network", {}).get("partners") or []:
            gene = row.get("gene")
            if gene:
                out.add(str(gene).upper())
        return out

    set_a, set_b = network_set(a), network_set(b)
    union, intersection = set_a | set_b, set_a & set_b
    jaccard = len(intersection) / len(union) if union else 1.0
    network_complementarity = 100.0 * (1.0 - jaccard)
    direct_interaction = b.gene.upper() in set_a or a.gene.upper() in set_b
    if direct_interaction:
        network_complementarity = min(100.0, network_complementarity + 10.0)

    ivy_a, ivy_b = a.live.get("ivy_gap", {}), b.live.get("ivy_gap", {})
    if ivy_a.get("ok") and ivy_b.get("ok"):
        zone_a, zone_b = ivy_a.get("top_zone"), ivy_b.get("top_zone")
        spatial_complementarity = 80.0 if zone_a and zone_b and zone_a != zone_b else 45.0
    else:
        spatial_complementarity = None

    rec_a = dim(a, "Longitudinal recurrence signal")
    rec_b = dim(b, "Longitudinal recurrence signal")
    recurrence_values = [x for x in (rec_a, rec_b) if x is not None]
    recurrence_coverage = max(recurrence_values) if recurrence_values else None

    feasible_a = bool(a.live.get("open_targets", {}).get("known_drug_count", 0))
    feasible_b = bool(b.live.get("open_targets", {}).get("known_drug_count", 0))
    bbb_support = int(a.live.get("bbb_candidates", {}).get("bbb_positive_count", 0)) + int(b.live.get("bbb_candidates", {}).get("bbb_positive_count", 0))
    translation = 50.0 * feasible_a + 50.0 * feasible_b
    if bbb_support:
        translation = min(100.0, translation + 10.0)

    state_comp = _state_complementarity(a.live.get("gbmap_cell_state", {}), b.live.get("gbmap_cell_state", {}))
    model_a, model_b = a.live.get("model_relevance", {}), b.live.get("model_relevance", {})
    conf_a = _num((a.live.get("overall_evidence_confidence") or {}).get("score"))
    conf_b = _num((b.live.get("overall_evidence_confidence") or {}).get("score"))
    pair_confidence = None if conf_a is None or conf_b is None else (conf_a + conf_b) / 2.0

    scored_components = {
        "individual_target_quality": target_quality,
        "functional_support": functional,
        "network_complementarity": network_complementarity,
        "spatial_complementarity": spatial_complementarity,
        "recurrence_coverage": recurrence_coverage,
        "translational_feasibility": translation,
    }
    weights = {
        "individual_target_quality": 0.24,
        "functional_support": 0.24,
        "network_complementarity": 0.18,
        "spatial_complementarity": 0.12,
        "recurrence_coverage": 0.10,
        "translational_feasibility": 0.12,
    }
    available = [(scored_components[k], weights[k]) for k in scored_components if scored_components[k] is not None]
    covered_weight = sum(weight for _, weight in available)
    rationale_score = sum(float(value) * weight for value, weight in available) / covered_weight if covered_weight else None

    components = dict(scored_components)
    components["malignant_cell_state_complementarity"] = state_comp
    components["pair_evidence_confidence"] = pair_confidence

    reasons, risks = [], []
    if functional is not None and functional >= 55:
        reasons.append("Both targets retain meaningful functional-dependency support after pan-essential safeguards.")
    if network_complementarity >= 60:
        reasons.append("The targets occupy relatively non-overlapping high-confidence interaction neighborhoods, supporting a complementary-pathway test.")
    if direct_interaction:
        reasons.append("The targets are directly connected in the retrieved STRING neighborhood, providing a mechanistic relationship to test.")
    if spatial_complementarity is not None and spatial_complementarity >= 70:
        reasons.append("The genes peak in different Ivy GAP anatomic compartments, raising a testable hypothesis of complementary niche coverage.")
    if state_comp is not None and state_comp >= 55:
        reasons.append("The targets show meaningfully different patient-weighted malignant-state expression patterns in GBmap, supporting a complementary-state experiment.")
    if recurrence_coverage is not None and recurrence_coverage >= 55:
        reasons.append("At least one target carries a meaningful recurrence-associated signal.")

    if not feasible_a or not feasible_b:
        risks.append("At least one target lacks a clear target-directed candidate in the current Open Targets output.")
    if dep_a.get("pan_essential") or dep_b.get("pan_essential"):
        risks.append("At least one target is pan-essential in DepMap, increasing therapeutic-window concern.")
    if network_complementarity < 30:
        risks.append("The targets occupy highly overlapping interaction neighborhoods; the pair may be mechanistically redundant.")
    if state_comp is not None and state_comp < 25:
        risks.append("The targets show highly overlapping malignant-state expression patterns; apparent combination value may reflect redundant state coverage.")
    if any((x.get("level") in {"limited", "low", "unknown", "very low"}) for x in (model_a, model_b)):
        risks.append("At least one target is supported mainly by limited model systems; validate the pair in patient-derived/3D GBM models before interpreting combination rationale.")

    return {
        "gene_a": a.gene,
        "gene_b": b.gene,
        "combination_rationale_score": None if rationale_score is None else round(max(0.0, min(100.0, rationale_score)), 1),
        "evidence_coverage_pct": round(100.0 * covered_weight / sum(weights.values()), 1),
        "components": {k: (None if v is None else round(float(v), 1)) for k, v in components.items()},
        "direct_string_interaction": direct_interaction,
        "network_jaccard": round(jaccard, 3),
        "model_relevance": {a.gene: model_a, b.gene: model_b},
        "cell_state_context": {
            a.gene: a.live.get("gbmap_cell_state", {}),
            b.gene: b.live.get("gbmap_cell_state", {}),
            "complementarity_score": None if state_comp is None else round(state_comp, 1),
        },
        "pair_evidence_confidence": _confidence(
            pair_confidence,
            ["Pair confidence summarizes confidence in the two underlying target profiles; it is separate from combination rationale."],
            ["Direct state-specific perturbation and dose-matrix experiments would materially increase confidence."],
        ),
        "why_test_it": reasons or ["The current evidence does not yet provide a strong complementary-target rationale."],
        "risks": risks,
        "validation_sequence": [
            "Measure single-agent dose-response and on-target engagement in at least two patient-derived IDH-wildtype GBM models plus non-neoplastic neural controls.",
            "Test the pair in a dose matrix and quantify interaction with a prespecified synergy model; do not infer synergy from this heuristic score.",
            "Repeat in state- or niche-matched spheroid/organoid conditions and assess whether the pair covers distinct resistant populations.",
            "Only after reproducible in-vitro interaction, test CNS exposure, tolerability, and orthotopic efficacy.",
        ],
        "caveat": "Combination Rationale prioritizes a pair for experimental testing. Cell-state complementarity, network structure and individual target evidence do not establish pharmacologic synergy, efficacy or safety.",
    }
'''
          p.write_text(t[:start] + new_pair + t[end:])

          p = Path('streamlit_app_v7.py')
          t = p.read_text()
          t = t.replace(
              '            "Patients": row.get("n_patients"),\n            "Patient Prevalence": row.get("patient_prevalence"),',
              '            "State Patients": row.get("n_state_patients"),\n            "Expressing Patients": row.get("n_expressing_patients"),\n            "Patient Prevalence": row.get("patient_prevalence"),',
          )
          old = '                    st.caption(f"Source: {record.provenance.source_dataset} | Confidence: {record.confidence.value} | Access: {record.provenance.access_tier.value}")\n                    for caveat in record.caveats:\n'
          new = '                    provenance = record.provenance\n                    retrieved = str(provenance.retrieved_at or "")[:10] or "N/A"\n                    version = provenance.dataset_version or "live/current"\n                    st.caption(f"Source: {provenance.source_dataset} | Version: {version} | Confidence: {record.confidence.value} | Access: {provenance.access_tier.value} | Retrieved: {retrieved}")\n                    if provenance.method:\n                        st.caption(f"Method: {provenance.method}")\n                    if provenance.citation_url:\n                        st.markdown(f"[Open source / citation]({provenance.citation_url})")\n                    for caveat in record.caveats:\n'
          if old not in t:
              raise SystemExit('Evidence UI block drifted')
          t = t.replace(old, new, 1)

          old = '''                for paper in papers:\n                    st.markdown(f"**{paper.get('title') or 'Untitled'}**")\n                    metadata = " | ".join(str(x) for x in [paper.get("journal"), paper.get("year"), paper.get("pmid") and f"PMID {paper.get('pmid')}"] if x)\n                    if metadata:\n                        st.caption(metadata)\n'''
          new = '''                for paper in papers:\n                    title = str(paper.get("title") or "Untitled")\n                    safe_title = title.replace("\\\\", "\\\\\\\\").replace("[", "\\\\[").replace("]", "\\\\]")\n                    if paper.get("url"):\n                        st.markdown(f"**[{safe_title}]({paper['url']})**")\n                    else:\n                        st.markdown(f"**{title}**")\n                    if paper.get("authors"):\n                        st.caption(paper.get("authors"))\n                    metadata = " | ".join(str(x) for x in [paper.get("journal"), paper.get("year"), paper.get("pmid") and f"PMID {paper.get('pmid')}", paper.get("doi") and f"DOI {paper.get('doi')}"] if x)\n                    if metadata:\n                        st.caption(metadata)\n'''
          if old not in t:
              raise SystemExit('Literature UI block drifted')
          t = t.replace(old, new, 1)

          hpa_marker = '            st.caption(hpa.get("interpretation", ""))\n'
          if hpa_marker in t and 'Open Human Protein Atlas' not in t:
              t = t.replace(hpa_marker, hpa_marker + '            if hpa.get("source_url"):\n                st.link_button("Open Human Protein Atlas", hpa["source_url"])\n', 1)
          network_marker = '            st.caption(network.get("interpretation", ""))\n'
          if network_marker in t and 'Open STRING Network' not in t:
              t = t.replace(network_marker, network_marker + '            if network.get("source_url"):\n                st.link_button("Open STRING Network", network["source_url"])\n', 1)
          t = t.replace(
              'The full >1.1-million-cell atlas is never downloaded per user query.',
              'The full Core GBmap H5AD is never downloaded per user query; production uses a compact patient-aware reference built offline from the published Core atlas.',
          )

          old = '    lines += ["", "## Evidence Gaps"] + [f"- {x}" for x in profile.evidence_gaps]\n    lines += ["", "## Data Source Status"] + [f"- **{k}:** {v}" for k, v in profile.source_status.items()]\n'
          new = '    lines += ["", "## Evidence Gaps"] + [f"- {x}" for x in profile.evidence_gaps]\n    papers = live.get("literature", {}).get("top_papers") or []\n    if papers:\n        lines += ["", "## Relevant Publications"]\n        for paper in papers:\n            title = paper.get("title") or "Untitled"\n            url = paper.get("url")\n            identifier = paper.get("doi") or (f"PMID {paper.get(\'pmid\')}" if paper.get("pmid") else "")\n            lines.append((f"- [{title}]({url})" if url else f"- {title}") + (f" — {identifier}" if identifier else ""))\n    lines += ["", f"**Generated:** {profile.dossier.generated_at}"]\n    lines += ["", "## Data Source Status"] + [f"- **{k}:** {v}" for k, v in profile.source_status.items()]\n'
          if old not in t:
              raise SystemExit('Export UI block drifted')
          t = t.replace(old, new, 1)
          p.write_text(t)

          p = Path('tests/test_research_intelligence_v7.py')
          t = p.read_text()
          if 'publication_url' not in t:
              t = t.replace('from gbm_evidence_engine.connectors.gbmap import summarize_gene_cell_states, state_vector\n', 'from gbm_evidence_engine.connectors.gbmap import summarize_gene_cell_states, state_vector\nfrom gbm_evidence_engine.connectors.europepmc import publication_url\n')
          t = t.replace('"gene", "state", "state_class", "n_cells", "n_patients", "patient_prevalence",\n                "fraction_expressing", "mean_expression", "median_expression", "expression_z_across_states",', '"gene", "state", "state_class", "n_cells", "n_state_patients", "n_expressing_patients", "patient_prevalence",\n                "fraction_expressing", "mean_expression", "expression_z_across_states",')
          replacements = {
              '["GENEX", "MES-like", "malignant", 1000, 20, 0.50, 0.70, 3.0, "", 1.2]': '["GENEX", "MES-like", "malignant", 1000, 20, 10, 0.50, 0.70, 3.0, 1.2]',
              '["GENEX", "OPC-like", "malignant", 800, 10, 0.25, 0.30, 1.0, "", -0.2]': '["GENEX", "OPC-like", "malignant", 800, 10, 3, 0.30, 0.30, 1.0, -0.2]',
              '["GENEX", "Macrophage", "microenvironment", 1500, 25, 0.625, 0.60, 2.0, "", 0.4]': '["GENEX", "Macrophage", "microenvironment", 1500, 25, 15, 0.60, 0.60, 2.0, 0.4]',
              '["GENEY", "MES-like", "malignant", 1000, 20, 0.50, 0.20, 0.5, "", -0.5]': '["GENEY", "MES-like", "malignant", 1000, 20, 4, 0.20, 0.20, 0.5, -0.5]',
              '["GENEY", "OPC-like", "malignant", 800, 25, 0.625, 0.80, 4.0, "", 1.5]': '["GENEY", "OPC-like", "malignant", 800, 25, 20, 0.80, 0.80, 4.0, 1.5]',
          }
          for old, new in replacements.items():
              t = t.replace(old, new)
          t = t.replace('assert x["malignant_patient_prevalence"] == 0.5', 'assert x["malignant_patient_prevalence"] == 0.5\n        assert x["top_malignant_state"]["n_expressing_patients"] == 10')
          if 'def test_publication_urls_are_clickable_and_stable' not in t:
              insertion = r'''

def test_publication_urls_are_clickable_and_stable():
    assert publication_url({"doi": "10.1000/example"}) == "https://doi.org/10.1000/example"
    assert publication_url({"pmid": "12345"}) == "https://pubmed.ncbi.nlm.nih.gov/12345/"
    assert publication_url({"pmcid": "PMC123"}) == "https://pmc.ncbi.nlm.nih.gov/articles/PMC123/"
    assert publication_url({"title": "A GBM paper"}).startswith("https://europepmc.org/search?query=")


def test_pair_analysis_builds_each_target_once():
    import copy
    import gbm_evidence_engine.research_intelligence_v7 as v7
    a = _profile()
    b = copy.deepcopy(a)
    a.gene, b.gene = "GENEA", "GENEB"
    for profile, partner in ((a, "GENEB"), (b, "GENEA")):
        profile.live["interaction_network"] = {"partners": [{"gene": partner}]}
        profile.live["bbb_candidates"] = {"bbb_positive_count": 1}
        profile.live["gbmap_cell_state"] = {"ok": False}
        profile.live["model_relevance"] = {"level": "high", "score": 85}
        profile.live["overall_evidence_confidence"] = {"level": "high", "score": 82}
    calls = []
    original = v7.build_research_profile
    try:
        def fake(gene):
            calls.append(gene.upper())
            return a if gene.upper() == "GENEA" else b
        v7.build_research_profile = fake
        result = v7.evaluate_gene_pair("GENEA", "GENEB")
    finally:
        v7.build_research_profile = original
    assert calls == ["GENEA", "GENEB"], calls
    assert result["gene_a"] == "GENEA" and result["gene_b"] == "GENEB"
    assert "pair_evidence_confidence" in result
'''
              marker = '\ndef test_benchmark_framework_refuses_to_call_live_case_retrospective():'
              t = t.replace(marker, insertion + marker, 1)
              t = t.replace('    test_benchmark_framework_refuses_to_call_live_case_retrospective()\n', '    test_publication_urls_are_clickable_and_stable()\n    test_pair_analysis_builds_each_target_once()\n    test_benchmark_framework_refuses_to_call_live_case_retrospective()\n')
          p.write_text(t)
          PY

      - name: Install production requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all production paths
        run: |
          python -m py_compile \
            gbm_evidence_engine/connectors/*.py \
            gbm_evidence_engine/research_intelligence.py \
            gbm_evidence_engine/research_intelligence_v3.py \
            gbm_evidence_engine/research_intelligence_v4.py \
            gbm_evidence_engine/research_intelligence_v5.py \
            gbm_evidence_engine/research_intelligence_v6.py \
            gbm_evidence_engine/research_discovery.py \
            gbm_evidence_engine/research_intelligence_v7.py \
            gbm_evidence_engine/benchmarking.py \
            scripts/build_gbmap_reference.py scripts/build_gbmap_reference_v3.py \
            streamlit_app.py streamlit_app_v5.py streamlit_app_v6.py streamlit_app_v6_guarded.py streamlit_app_v7.py api/app.py

      - name: Full deterministic scientific and grounding suite
        run: |
          PYTHONPATH=. python tests/test_survival.py
          PYTHONPATH=. python tests/test_dependency.py
          PYTHONPATH=. python tests/test_evidence_model.py
          PYTHONPATH=. python tests/test_grounding_validator.py
          PYTHONPATH=. python tests/test_research_intelligence.py
          PYTHONPATH=. python tests/test_research_intelligence_v3.py
          PYTHONPATH=. python tests/test_glass_gbm_specific.py
          PYTHONPATH=. python tests/test_research_intelligence_v5.py
          PYTHONPATH=. python tests/test_research_intelligence_v6.py
          PYTHONPATH=. python tests/test_research_discovery.py
          PYTHONPATH=. python tests/test_research_intelligence_v7.py

      - name: Live literature-link smoke test
        run: |
          PYTHONPATH=. python - <<'PY'
          from gbm_evidence_engine.connectors.europepmc import top_papers
          rows = top_papers('EGFR', page_size=3)
          assert rows, rows
          assert all(row.get('title') and row.get('url') for row in rows), rows
          print([(r.get('title'), r.get('url')) for r in rows])
          PY

      - name: Streamlit exact profile interaction
        run: |
          python - <<'PY'
          from pathlib import Path
          from streamlit.testing.v1 import AppTest
          app = Path.cwd() / 'streamlit_app.py'
          at = AppTest.from_file(app, default_timeout=240).run(timeout=30)
          assert not list(at.exception), list(at.exception)
          button = next(x for x in at.button if x.label == 'Build Research Profile')
          button.click().run(timeout=240)
          assert not list(at.exception), list(at.exception)
          assert any(x.label == 'Target Priority Score' for x in at.metric)
          assert any('Relevant Publications' in str(getattr(x, 'value', '')) for x in at.markdown)
          assert any('http' in str(getattr(x, 'value', '')) for x in at.markdown)
          print('STREAMLIT PROFILE + PUBLICATION LINKS OK')
          PY

      - name: Live target-pair path
        run: |
          PYTHONPATH=. python - <<'PY'
          from gbm_evidence_engine.research_intelligence_v7 import evaluate_gene_pair
          result = evaluate_gene_pair('EGFR', 'CDK4')
          assert result.get('combination_rationale_score') is not None, result
          assert 'profiles' not in result
          assert result.get('pair_evidence_confidence', {}).get('score') is not None
          assert 'malignant_cell_state_complementarity' in result.get('components', {})
          print('PAIR_OK', result['combination_rationale_score'], result['evidence_coverage_pct'])
          PY

      - name: Live researcher-signature path
        run: |
          PYTHONPATH=. python - <<'PY'
          from gbm_evidence_engine.research_intelligence_v7 import analyze_researcher_signature
          genes = ['EGFR','STAT3','SOX2','CDK6','OLIG2','GFAP','CDKN1A','BAX']
          effects = [2.4,1.6,1.4,1.2,-1.0,-1.3,-1.7,-2.0]
          p = [1e-4,1e-3,2e-3,0.01,0.02,0.003,0.001,1e-4]
          q = [0.002,0.01,0.02,0.04,0.05,0.02,0.01,0.002]
          result = analyze_researcher_signature(genes, effects, p_values=p, fdr_values=q, profile_limit=1, l1000_results=5)
          assert result.get('ok') and result.get('top_genes_profiled'), result
          assert result.get('l1000_reversal', {}).get('ok'), result.get('l1000_reversal')
          print('SIGNATURE_OK', result['top_genes_profiled'][0])
          PY

      - name: API health and import audit
        run: |
          PYTHONPATH=. python - <<'PY'
          from api.app import health
          result = health()
          assert result['status'] == 'ok'
          assert result['version'] == '7.0.0'
          print(result)
          PY

      - name: Restore permanent CI and commit validated audit fixes
        run: |
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches: [main, research-grade-cohorts, v5-research-capacity, v6-discovery-system, v7-frozen-scope]
            pull_request:

          jobs:
            scientific-validation:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - name: Install scientific and UI test dependencies
                  run: |
                    python -m pip install --upgrade pip
                    pip install numpy pandas scipy streamlit==1.63.0
                - name: Syntax validation
                  run: |
                    python -m py_compile gbm_evidence_engine/connectors/*.py gbm_evidence_engine/research_intelligence.py gbm_evidence_engine/research_intelligence_v3.py gbm_evidence_engine/research_intelligence_v4.py gbm_evidence_engine/research_intelligence_v5.py gbm_evidence_engine/research_intelligence_v6.py gbm_evidence_engine/research_discovery.py gbm_evidence_engine/research_intelligence_v7.py gbm_evidence_engine/benchmarking.py scripts/build_gbmap_reference.py scripts/build_gbmap_reference_v3.py streamlit_app.py streamlit_app_v5.py streamlit_app_v6.py streamlit_app_v6_guarded.py streamlit_app_v7.py api/app.py
                - name: Scientific and grounding tests
                  run: |
                    PYTHONPATH=. python tests/test_survival.py
                    PYTHONPATH=. python tests/test_dependency.py
                    PYTHONPATH=. python tests/test_evidence_model.py
                    PYTHONPATH=. python tests/test_grounding_validator.py
                    PYTHONPATH=. python tests/test_research_intelligence.py
                    PYTHONPATH=. python tests/test_research_intelligence_v3.py
                    PYTHONPATH=. python tests/test_glass_gbm_specific.py
                    PYTHONPATH=. python tests/test_research_intelligence_v5.py
                    PYTHONPATH=. python tests/test_research_intelligence_v6.py
                    PYTHONPATH=. python tests/test_research_discovery.py
                    PYTHONPATH=. python tests/test_research_intelligence_v7.py
                - name: Streamlit render and rerun regression
                  run: |
                    python - <<'PY'
                    from pathlib import Path
