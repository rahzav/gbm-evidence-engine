name: CI

on:
  push:
    branches: [main, research-grade-cohorts, v5-research-capacity, v6-discovery-system]
  pull_request:

jobs:
  scientific-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific and UI test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy streamlit==1.63.0
      - name: Syntax validation
        run: |
          python -m py_compile \
            gbm_evidence_engine/connectors/base.py \
            gbm_evidence_engine/connectors/cbioportal.py \
            gbm_evidence_engine/connectors/opentargets.py \
            gbm_evidence_engine/connectors/europepmc.py \
            gbm_evidence_engine/connectors/clinicaltrials.py \
            gbm_evidence_engine/connectors/depmap.py \
            gbm_evidence_engine/connectors/ivygap.py \
            gbm_evidence_engine/connectors/cgga.py \
            gbm_evidence_engine/connectors/glass.py \
            gbm_evidence_engine/connectors/mygene.py \
            gbm_evidence_engine/connectors/hpa.py \
            gbm_evidence_engine/connectors/stringdb.py \
            gbm_evidence_engine/connectors/b3db_live.py \
            gbm_evidence_engine/connectors/l1000cds2.py \
            gbm_evidence_engine/research_intelligence.py \
            gbm_evidence_engine/research_intelligence_v3.py \
            gbm_evidence_engine/research_intelligence_v4.py \
            gbm_evidence_engine/research_intelligence_v5.py \
            gbm_evidence_engine/research_intelligence_v6.py \
            streamlit_app.py streamlit_app_v5.py streamlit_app_v6.py api/app.py
      - name: Scientific and grounding tests
        run: |
          PYTHONPATH=. python tests/test_survival.py
          PYTHONPATH=. python tests/test_dependency.py
          PYTHONPATH=. python tests/test_evidence_model.py
          PYTHONPATH=. python tests/test_grounding_validator.py
          PYTHONPATH=. python tests/test_research_intelligence.py
          PYTHONPATH=. python tests/test_research_intelligence_v3.py
          PYTHONPATH=. python tests/test_glass_gbm_specific.py
          PYTHONPATH=. python tests/test_research_intelligence_v5.py
          PYTHONPATH=. python tests/test_research_intelligence_v6.py
      - name: Streamlit render and rerun regression
        run: |
          python - <<'PY'
          from pathlib import Path
          from streamlit.testing.v1 import AppTest

          app = Path.cwd() / "streamlit_app.py"
          at = AppTest.from_file(app, default_timeout=30).run(timeout=30)
          assert not list(at.exception), list(at.exception)
          assert any(getattr(x, "value", None) == "GBM Gene Analysis" for x in at.title)
          assert len(at.tabs) == 5
          gene = next(x for x in at.text_input if x.label == "Gene symbol")
          gene.set_value("PTEN").run(timeout=30)
          assert not list(at.exception), list(at.exception)
          assert any(getattr(x, "value", None) == "GBM Gene Analysis" for x in at.title)
          print("STREAMLIT V6 RERUN TEST PASSED")
          PY
      - name: Live DepMap NextGen smoke test
        if: github.ref == 'refs/heads/v6-discovery-system'
        run: |
          PYTHONPATH=. python - <<'PY'
          from gbm_evidence_engine.connectors.depmap import summarize_gene_dependency
          result = summarize_gene_dependency("EGFR")
          print(result)
          assert result.get("ok"), result
          assert result.get("n_gbm", 0) >= 3
          assert "nextgen_model_context" in result
          print("DEPMAP LIVE V6 OK")
          PY
      - name: Live L1000CDS2 reversal smoke test
        if: github.ref == 'refs/heads/v6-discovery-system'
        run: |
          PYTHONPATH=. python - <<'PY'
          from gbm_evidence_engine.connectors.l1000cds2 import reverse_weighted_signature
          genes = ["EGFR","STAT3","SOX2","CDK6","OLIG2","GFAP","CDKN1A","BAX"]
          values = [2.4,1.6,1.4,1.2,-1.0,-1.3,-1.7,-2.0]
          result = reverse_weighted_signature(genes, values, combinations=True, max_results=5)
          print(result)
          assert result.get("ok"), result
          assert result.get("top_drugs"), result
          print("L1000 LIVE V6 OK")
          PY
      - name: Full live V6 EGFR profile smoke test
        if: github.ref == 'refs/heads/v6-discovery-system'
        run: |
          PYTHONPATH=. python - <<'PY'
          from gbm_evidence_engine.research_intelligence_v6 import build_research_profile
          profile = build_research_profile("EGFR")
          print("gene", profile.gene)
          print("score", profile.score.overall, "coverage", profile.score.evidence_coverage_pct)
          print("opportunities", profile.live.get("research_opportunities"))
          print("hypotheses", profile.live.get("mechanistic_hypotheses"))
          print("experiments", profile.live.get("experiment_portfolio"))
          assert profile.gene == "EGFR"
          assert profile.score.overall is not None
          assert "research_opportunities" in profile.live
          assert "mechanistic_hypotheses" in profile.live
          assert profile.live.get("experiment_portfolio")
          print("FULL LIVE V6 PROFILE OK")
          PY
