name: GBmap Reference Build

on:
  push:
    branches: [v7-gbmap-build]

permissions:
  contents: write

jobs:
  build-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Free build disk
        run: |
          echo 'Before cleanup:'
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean || true
          echo 'After cleanup:'
          df -h /

      - name: Install offline aggregation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'anndata>=0.10,<0.13' h5py numpy scipy pandas

      - name: Validate published Core GBmap metadata
        run: |
          PYTHONPATH=. python scripts/build_gbmap_reference_v3.py --metadata-only

      - name: Build compact patient-aware GBmap reference
        run: |
          PYTHONPATH=. python scripts/build_gbmap_reference_v3.py \
            --output /tmp/gbmap_gene_state_summary.csv.gz \
            --metadata-output /tmp/gbmap_reference_metadata.json \
            --chunk-size 4096
          ls -lh /tmp/gbmap_gene_state_summary.csv.gz /tmp/gbmap_reference_metadata.json
          bytes=$(stat -c%s /tmp/gbmap_gene_state_summary.csv.gz)
          if [ "$bytes" -ge 95000000 ]; then
            echo "Compact reference is ${bytes} bytes, too large for a normal GitHub blob."
            exit 1
          fi

      - name: Validate derived reference scientifically
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from gbm_evidence_engine.connectors.gbmap import summarize_gene_cell_states

          path = Path('/tmp/gbmap_gene_state_summary.csv.gz')
          meta = json.loads(Path('/tmp/gbmap_reference_metadata.json').read_text())
          print(meta)
          assert meta['n_cells'] >= 300000, meta
          assert meta['n_patients'] >= 100, meta
          assert meta['n_states'] >= 10, meta
          assert meta['rows_written'] > 100000, meta

          for gene in ['EGFR', 'SOX2', 'OLIG2', 'GFAP', 'CDK4', 'PTEN']:
              result = summarize_gene_cell_states(gene, path=path)
              print(gene, result.get('top_malignant_state'), result.get('malignant_patient_prevalence'))
              assert result.get('ok'), result
              assert result.get('n_malignant_states', 0) >= 3, result
              top = result.get('top_malignant_state') or {}
              assert top.get('state'), result
              prev = top.get('patient_prevalence')
              assert prev is not None and 0 <= prev <= 1, result
              assert top.get('n_expressing_patients') is not None, result
              assert top.get('n_state_patients') is not None, result
              assert top['n_expressing_patients'] <= top['n_state_patients'], result
          print('COMPACT GBMAP REFERENCE VALIDATED')
          PY

      - name: Commit derived reference to V7 branch
        env:
          TARGET_BRANCH: v7-frozen-scope
        run: |
          cp /tmp/gbmap_gene_state_summary.csv.gz /tmp/reference-copy.csv.gz
          cp /tmp/gbmap_reference_metadata.json /tmp/metadata-copy.json
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          mkdir -p data
          cp /tmp/reference-copy.csv.gz data/gbmap_gene_state_summary.csv.gz
          cp /tmp/metadata-copy.json data/gbmap_reference_metadata.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/gbmap_gene_state_summary.csv.gz data/gbmap_reference_metadata.json
          git commit -m 'Add compact Core GBmap cell-state reference'
          git push origin HEAD:"$TARGET_BRANCH"
