name: Deployed UI Cleanup

on:
  push:
    branches: [deployed-ui-cleanup]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deployed-ui-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply UI cleanup
        run: python scripts/apply_deployed_ui_cleanup.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile changed production paths
        run: |
          python -m py_compile gbm_evidence_engine/connectors/europepmc.py streamlit_app_v5.py streamlit_app.py
      - name: Verify publication links from live Europe PMC
        run: |
          PYTHONPATH=. python - <<'PY'
          from gbm_evidence_engine.connectors.europepmc import top_papers
          rows = top_papers('EGFR', page_size=3)
          assert rows, rows
          assert all(row.get('title') and row.get('url') for row in rows), rows
          assert all(row['url'].startswith('https://') for row in rows), rows
          print([(row['title'], row['url']) for row in rows])
          PY
      - name: Verify Streamlit page renders
        run: |
          python - <<'PY'
          from pathlib import Path
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file(Path.cwd() / 'streamlit_app.py', default_timeout=30).run(timeout=30)
          assert not list(at.exception), list(at.exception)
          assert any(getattr(x, 'value', None) == 'GBM Gene Analysis' for x in at.title)
          print('STREAMLIT RENDER OK')
          PY
      - name: Verify cleaned evidence UI source
        run: |
          python - <<'PY'
          text = open('streamlit_app_v5.py').read()
          assert 'Access: {record.provenance.access_tier.value}' not in text
          assert 'record.statistic_name.replace("_", " ")' in text
          assert "paper['url']" in text
          assert 'for caveat in record.caveats' not in text
          print('UI CLEANUP ASSERTIONS OK')
          PY
      - name: Commit validated deployed fix
        run: |
          rm scripts/apply_deployed_ui_cleanup.py .github/workflows/deployed_ui_cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish evidence display and link publications"
          git push origin HEAD:deployed-ui-cleanup
