name: Final researcher copy cleanup

on:
  push:
    branches: [ux-professional-copy-cleanup]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-professional-copy-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final copy cleanup
        run: python scripts/final_researcher_copy_cleanup.py
      - name: Validate source
        run: |
          python -m py_compile streamlit_app_v5.py
          python - <<'PY'
          from pathlib import Path
          text = Path('streamlit_app_v5.py').read_text()
          for forbidden in [
              'help=HELP["gene_symbol"]',
              'Start with Overview.',
              'Tool-generated recommendations are kept out of this workspace.',
              'authorized Synapse token',
              'maintain reasonable load on public research sources',
              'retains the validated V4 evidence model',
              'V5 adds canonical gene identity',
          ]:
              assert forbidden not in text, forbidden
          assert 'Research prioritization only; not a measure of causality or clinical benefit.' in text
          assert 'st.subheader("Genomic Evidence", anchor=False)' in text
          assert 'help=HELP["chronos"]' in text
          assert 'help=HELP["pooled_hr"]' in text
          print('Final researcher-facing copy checks passed')
          PY
      - name: Commit app-only cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/final_researcher_copy_cleanup.py .github/workflows/final_researcher_copy_cleanup.yml
          git add streamlit_app_v5.py
          git commit -m "Polish researcher-facing terminology"
          git push origin HEAD:ux-professional-copy-cleanup
