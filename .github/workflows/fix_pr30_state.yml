name: Fix PR30 State

on:
  push:
    branches:
      - upgrade-glia-ux-tour-context
    paths:
      - .github/workflows/fix_pr30_state.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade-glia-ux-tour-context
      - name: Initialize workflow tab state
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          path = Path('app_ui.py')
          text = path.read_text(encoding='utf-8')
          old = '''analysis_tab, pair_tab, researcher_tab, batch_tab, methods_tab = st.tabs(\n    ['''
          new = '''st.session_state.setdefault("research_workflow_tabs", "Gene Analysis")\n\nanalysis_tab, pair_tab, researcher_tab, batch_tab, methods_tab = st.tabs(\n    ['''
          if old not in text:
              raise SystemExit('Expected top-level tabs block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile app_ui.py
          git add app_ui.py
          git commit -m "Initialize active workflow state"
          git push origin upgrade-glia-ux-tour-context
