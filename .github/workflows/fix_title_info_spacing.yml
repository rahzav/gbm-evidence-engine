name: Fix title info spacing

on:
  push:
    branches: [ux-title-inline-info]
    paths:
      - scripts/fix_title_info_spacing.py
      - .github/workflows/fix_title_info_spacing.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-title-inline-info
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply title patch
        run: python scripts/fix_title_info_spacing.py
      - name: Validate syntax and header contract
        run: |
          python -m py_compile streamlit_app_v5.py
          python - <<'PY'
          from pathlib import Path
          text = Path('streamlit_app_v5.py').read_text()
          required = [
              'font-size:2.75rem',
              'width="content"',
              'gap="xxsmall"',
              'key="open_walkthrough"',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'Missing header elements: {missing}')
          banned = [
              'title_col, info_col, spacer_col',
              'st.title("GBM Gene Analysis")',
          ]
          found = [x for x in banned if x in text]
          if found:
              raise SystemExit(f'Old anchored/column title remains: {found}')
          PY
      - name: Install app dependencies
        run: pip install -r requirements.txt
      - name: Streamlit smoke
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file('streamlit_app.py').run(timeout=30)
          if at.exception:
              raise SystemExit(at.exception)
          assert at.button(key='open_walkthrough')
          print('header smoke passed')
          PY
      - name: Commit app change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add streamlit_app_v5.py
          git commit -m "Place walkthrough info icon directly beside title"
          git push origin HEAD:ux-title-inline-info
