name: Fix title info spacing

on:
  push:
    branches: [ux-title-info-spacing]
    paths:
      - scripts/fix_title_info_spacing.py
      - .github/workflows/fix_title_info_spacing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-title-info-spacing
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_title_info_spacing.py
      - run: python -m py_compile streamlit_app_v5.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add streamlit_app_v5.py
          git commit -m "Keep walkthrough info icon beside title"
          git push origin HEAD:ux-title-info-spacing
