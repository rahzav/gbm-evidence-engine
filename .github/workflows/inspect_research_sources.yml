name: Inspect research-grade sources

on:
  push:
    branches: [research-grade-cohorts]
    paths: ['.github/workflows/inspect_research_sources.yml']

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect Ivy normalized RNA-seq layout
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 'https://glioblastoma.alleninstitute.org/api/v2/well_known_file_download/305873915' -o /tmp/ivy_expr.zip
          echo 'ROWS-GENES'; unzip -p /tmp/ivy_expr.zip rows-genes.csv | head -n 4 | cut -c1-1000 || true
          echo 'FPKM'; unzip -p /tmp/ivy_expr.zip fpkm_table.csv | head -n 4 | cut -c1-1500 || true
          echo 'STRUCTURES'
          unzip -p /tmp/ivy_expr.zip columns-samples.csv > /tmp/ivy_cols.csv
          python - <<'PY'
          import csv
          with open('/tmp/ivy_cols.csv', newline='') as f:
              rows=list(csv.DictReader(f))
          for x in sorted({r['structure_abbreviation'] for r in rows}): print(x)
          print('n columns',len(rows))
          PY
      - name: Inspect CGGA 325 cohort layout
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 'https://www.cgga.org.cn/download?file=download%2F20200506%2FCGGA.mRNAseq_325_clinical.20200506.txt.zip&time=20200506&type=mRNAseq_325_clinical' -o /tmp/c325.zip
          curl -L --fail --retry 3 'https://www.cgga.org.cn/download?file=download%2F20200506%2FCGGA.mRNAseq_325.RSEM-genes.20200506.txt.zip&time=20200506&type=mRNAseq_325' -o /tmp/e325.zip
          cf=$(unzip -Z1 /tmp/c325.zip | grep -v '^__MACOSX' | head -n 1); ef=$(unzip -Z1 /tmp/e325.zip | grep -v '^__MACOSX' | head -n 1)
          echo "CLIN $cf"; unzip -p /tmp/c325.zip "$cf" | head -n 3 | cut -c1-1000 || true
          echo "EXPR $ef"; unzip -p /tmp/e325.zip "$ef" | head -n 2 | cut -c1-1200 || true
