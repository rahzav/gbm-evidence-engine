name: Polish Glia Workspace

on:
  push:
    branches: [polish-glia-workspace]
    paths:
      - '.github/workflows/polish_glia_workspace.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-glia-workspace
      - name: Apply Glia workspace polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          # --- glia_interface.py ---
          path = Path('glia_interface.py')
          text = path.read_text(encoding='utf-8')

          old_selection_css = '''#glia-selection-action {
  position:fixed; z-index:1000002; display:none;
  border:1px solid color-mix(in srgb, var(--st-text-color, #111) 17%, transparent);
  background:var(--st-background-color, #fff); color:inherit; border-radius:8px;
  box-shadow:0 6px 20px rgba(0,0,0,.16); padding:6px 9px; font-size:.76rem;
  font-weight:720; cursor:pointer;
}
#glia-selection-action.glia-visible { display:block; }

body.glia-panel-open [data-testid="stAppViewBlockContainer"] {
  max-width: calc(100vw - 390px) !important;
  padding-right: 2rem !important;
  margin-left: 0 !important;
  margin-right: auto !important;
}

@media (max-width: 980px) {
  #glia-shell { width:min(92vw, 390px); }
  body.glia-panel-open [data-testid="stAppViewBlockContainer"] { max-width:100% !important; padding-right:1rem !important; }
}
'''
          new_selection_css = '''#glia-selection-action {
  position:fixed; z-index:1000002; display:none;
  border:1px solid color-mix(in srgb, var(--st-text-color, #111) 24%, transparent);
  background:var(--st-text-color, #111); color:var(--st-background-color, #fff); border-radius:8px;
  box-shadow:0 6px 20px rgba(0,0,0,.18); padding:6px 9px; font-size:.76rem;
  font-weight:720; cursor:pointer;
}
#glia-selection-action.glia-visible { display:block; }

@media (min-width: 981px) {
  body.glia-panel-open [data-testid="stAppViewContainer"] {
    width: calc(100% - 390px) !important;
    max-width: calc(100% - 390px) !important;
  }
  body.glia-panel-open [data-testid="stAppViewBlockContainer"] {
    width:100% !important;
    max-width:100% !important;
    padding-right:2rem !important;
  }
}

@media (max-width: 980px) {
  #glia-shell { width:min(92vw, 390px); }
  body.glia-panel-open [data-testid="stAppViewContainer"] { width:100% !important; max-width:100% !important; }
  body.glia-panel-open [data-testid="stAppViewBlockContainer"] { max-width:100% !important; padding-right:1rem !important; }
}
'''
          if old_selection_css not in text:
              raise SystemExit('Expected Glia selection/layout CSS block not found')
          text = text.replace(old_selection_css, new_selection_css, 1)

          old_set_open = '''  const setOpen = (open) => {
    runtime.open = Boolean(open);
    try { localStorage.setItem(UI_KEY, JSON.stringify({open: runtime.open})); } catch (_) {}
    render();
  };

  const memory = data.memory_summary || {};
'''
          new_set_open = '''  const workspaceTarget = () =>
    document.querySelector('[data-testid="stAppViewContainer"]') || document.querySelector('.stApp');
  const syncWorkspaceLayout = () => {
    const target = workspaceTarget();
    if (!target) return;
    if (runtime.open && window.innerWidth > 980) {
      target.style.width = "calc(100% - 390px)";
      target.style.maxWidth = "calc(100% - 390px)";
      target.style.marginRight = "390px";
      target.style.transition = "width .18s ease, max-width .18s ease, margin-right .18s ease";
    } else {
      target.style.removeProperty("width");
      target.style.removeProperty("max-width");
      target.style.removeProperty("margin-right");
      target.style.removeProperty("transition");
    }
  };
  const setOpen = (open) => {
    runtime.open = Boolean(open);
    try { localStorage.setItem(UI_KEY, JSON.stringify({open: runtime.open})); } catch (_) {}
    render();
  };

  const memory = data.memory_summary || {};
'''
          if old_set_open not in text:
              raise SystemExit('Expected setOpen block not found')
          text = text.replace(old_set_open, new_set_open, 1)

          old_render_start = '''    shell.classList.toggle("glia-closed", !runtime.open);
    launcher.classList.toggle("glia-visible", !runtime.open);
    document.body.classList.toggle("glia-panel-open", runtime.open);

    const geneCount = Number(memory.gene_count || 0);
    const memoryText = geneCount > 0
      ? `Memory on · ${geneCount} gene${geneCount === 1 ? "" : "s"} in your research trail`
      : "Memory on · research context will carry across visits";
'''
          new_render_start = '''    shell.classList.toggle("glia-closed", !runtime.open);
    launcher.classList.toggle("glia-visible", !runtime.open);
    document.body.classList.toggle("glia-panel-open", runtime.open);
    syncWorkspaceLayout();

    const geneCount = Number(memory.gene_count || 0);
    const memoryText = geneCount > 0
      ? `Memory on · ${geneCount} gene${geneCount === 1 ? "" : "s"} remembered`
      : "Memory on · carries across visits";
'''
          if old_render_start not in text:
              raise SystemExit('Expected render memory block not found')
          text = text.replace(old_render_start, new_render_start, 1)

          old_empty = '''${messages.length ? messages.map(renderMessage).join("") : `<div class="glia-empty"><div class="glia-empty-title">Work with the evidence, not around it.</div><div class="glia-empty-copy">Ask about the current analysis, challenge a finding, compare targets, trace a contradiction, or highlight text anywhere in the workspace and choose <b>Ask Glia</b>.</div></div>`}'''
          new_empty = '''${messages.length ? messages.map(renderMessage).join("") : `<div class="glia-empty"><div class="glia-empty-title">Ask Glia</div><div class="glia-empty-copy">Ask about the current analysis or highlight text and choose <b>Ask Glia</b>.</div></div>`}'''
          if old_empty not in text:
              raise SystemExit('Expected Glia empty-state copy not found')
          text = text.replace(old_empty, new_empty, 1)

          old_nearest = '''  function onMouseUp(event) {
    if (event.target?.closest?.("#glia-shell, #glia-launcher, #glia-selection-action, input, textarea, button")) return;
    window.setTimeout(() => {
      const selection = window.getSelection();
      const text = String(selection?.toString() || "").replace(/\\s+/g, " ").trim();
'''
          new_nearest = '''  function selectionTouchesIgnoredArea(selection) {
    if (!selection || selection.rangeCount === 0) return false;
    const nodes = [selection.anchorNode, selection.focusNode];
    const endpointInsideIgnored = nodes.some((node) => {
      const element = node?.nodeType === Node.ELEMENT_NODE ? node : node?.parentElement;
      return Boolean(element?.closest?.('[data-glia-ignore-selection="true"]'));
    });
    if (endpointInsideIgnored) return true;
    return Array.from(document.querySelectorAll('[data-glia-ignore-selection="true"]'))
      .some((element) => selection.containsNode(element, true));
  }

  function onMouseUp(event) {
    if (event.target?.closest?.("#glia-shell, #glia-launcher, #glia-selection-action, input, textarea, button")) return;
    window.setTimeout(() => {
      const selection = window.getSelection();
      if (selectionTouchesIgnoredArea(selection)) {
        selectionAction.classList.remove("glia-visible");
        return;
      }
      const text = String(selection?.toString() || "").replace(/\\s+/g, " ").trim();
'''
          if old_nearest not in text:
              raise SystemExit('Expected selection mouseup block not found')
          text = text.replace(old_nearest, new_nearest, 1)

          old_listener = '''  document.addEventListener("mouseup", onMouseUp, true);
  document.addEventListener("mousedown", onMouseDown, true);
  render();

  return () => {
    document.removeEventListener("mouseup", onMouseUp, true);
    document.removeEventListener("mousedown", onMouseDown, true);
    document.body.classList.remove("glia-panel-open");
'''
          new_listener = '''  document.addEventListener("mouseup", onMouseUp, true);
  document.addEventListener("mousedown", onMouseDown, true);
  window.addEventListener("resize", syncWorkspaceLayout);
  render();

  return () => {
    document.removeEventListener("mouseup", onMouseUp, true);
    document.removeEventListener("mousedown", onMouseDown, true);
    window.removeEventListener("resize", syncWorkspaceLayout);
    const target = workspaceTarget();
    if (target) {
      target.style.removeProperty("width");
      target.style.removeProperty("max-width");
      target.style.removeProperty("margin-right");
      target.style.removeProperty("transition");
    }
    document.body.classList.remove("glia-panel-open");
'''
          if old_listener not in text:
              raise SystemExit('Expected listener cleanup block not found')
          text = text.replace(old_listener, new_listener, 1)
          path.write_text(text, encoding='utf-8')

          # --- app_ui.py ---
          path = Path('app_ui.py')
          text = path.read_text(encoding='utf-8')
          old_title = '<div style="font-size:2.75rem;font-weight:700;line-height:1.08;letter-spacing:-0.02em;margin:0;padding:0;">GBM Gene Analysis</div>'
          new_title = '<div data-glia-ignore-selection="true" style="font-size:2.75rem;font-weight:700;line-height:1.08;letter-spacing:-0.02em;margin:0;padding:0;">GBM Gene Analysis</div>'
          old_desc = '<div style="font-size:1.04rem;line-height:1.42;opacity:.68;margin:.38rem 0 0 0;padding:0;">Real-time integrated gene-level evidence synthesis for glioblastoma research.</div>'
          new_desc = '<div data-glia-ignore-selection="true" style="font-size:1.04rem;line-height:1.42;opacity:.68;margin:.38rem 0 0 0;padding:0;">Real-time integrated gene-level evidence synthesis for glioblastoma research.</div>'
          if old_title not in text or old_desc not in text:
              raise SystemExit('Expected main header title/description not found')
          text = text.replace(old_title, new_title, 1).replace(old_desc, new_desc, 1)
          path.write_text(text, encoding='utf-8')

          # --- tests/test_glia_interface.py ---
          path = Path('tests/test_glia_interface.py')
          text = path.read_text(encoding='utf-8')
          old_required = '''        "glia-panel-open",
        "Research memory",
    ):
        assert required in source, required


if __name__ == "__main__":
'''
          new_required = '''        "glia-panel-open",
        "Research memory",
        "selectionTouchesIgnoredArea",
        "syncWorkspaceLayout",
        "Memory on · carries across visits",
        "background:var(--st-text-color, #111); color:var(--st-background-color, #fff)",
    ):
        assert required in source, required


def test_main_header_is_excluded_from_ask_glia_selection():
    source = Path("app_ui.py").read_text(encoding="utf-8")
    assert source.count('data-glia-ignore-selection="true"') >= 2


if __name__ == "__main__":
'''
          if old_required not in text:
              raise SystemExit('Expected Glia test block not found')
          text = text.replace(old_required, new_required, 1)
          text = text.replace(
              '    test_component_contains_required_integrated_interactions()\n    print("GLIA INTERFACE TESTS OK")',
              '    test_component_contains_required_integrated_interactions()\n    test_main_header_is_excluded_from_ask_glia_selection()\n    print("GLIA INTERFACE TESTS OK")',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

          python -m py_compile app_ui.py glia_interface.py tests/test_glia_interface.py
          PYTHONPATH=. python tests/test_glia_interface.py
          git add app_ui.py glia_interface.py tests/test_glia_interface.py
          git commit -m "Polish Glia selection and workspace layout"
          git push origin polish-glia-workspace
