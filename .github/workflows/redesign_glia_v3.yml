name: Apply Glia-Centered Redesign

on:
  push:
    branches:
      - redesign-glia-centered-v3
    paths:
      - .github/workflows/redesign_glia_v3.yml

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign-glia-centered-v3
      - name: Apply product redesign
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/redesign_glia_v3.py
          python -m py_compile app_ui.py ui_walkthroughs.py glia_interface.py gbm_evidence_engine/research_agent.py tests/test_glia_interface.py tests/test_research_agent.py
          git add app_ui.py ui_walkthroughs.py glia_interface.py gbm_evidence_engine/research_agent.py tests/test_glia_interface.py tests/test_research_agent.py
          git commit -m "Redesign product around Glia research copilot"
          git push origin redesign-glia-centered-v3
