name: Redesign visual walkthrough

on:
  push:
    branches: [ux-visual-walkthrough]
    paths:
      - scripts/redesign_walkthrough_visual.py
      - .github/workflows/redesign_visual_walkthrough.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-visual-walkthrough
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply visual walkthrough patch
        run: python scripts/redesign_walkthrough_visual.py
      - name: Validate walkthrough structure
        run: |
          python -m py_compile streamlit_app_v5.py
          python - <<'PY'
          from pathlib import Path
          text = Path('streamlit_app_v5.py').read_text()
          required = [
              'Priority Score & Evidence Coverage',
              'Genomic Evidence',
              'Functional & Spatial Evidence',
              'Human Validation',
              'Biological Context',
              'Literature & Translation',
              'Evidence Record & Research Gaps',
              'Illustrative preview',
              'st.metric("Median GBM Chronos", "-0.42")',
              'st.dataframe(',
              '_walkthrough_note',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'Missing visual walkthrough elements: {missing}')
          banned = [
              'Target Priority Score and Evidence Coverage',
              'Evidence Summary and Evidence Consistency',
              'Genomic Evidence and Disease Association',
              'Normal Tissue, Network, and GBM Cellular Context',
              'Literature, Target-Directed Candidates, Trials, and BBB Evidence',
          ]
          found = [x for x in banned if x in text]
          if found:
              raise SystemExit(f'Old encyclopedia walkthrough copy remains: {found}')
          PY
      - name: Install app dependencies
        run: pip install -r requirements.txt
      - name: Streamlit walkthrough smoke
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file('streamlit_app.py').run(timeout=30)
          if at.exception:
              raise SystemExit(at.exception)
          assert at.session_state['walkthrough_open'] is True
          assert at.session_state['walkthrough_step'] == 0
          assert any(m.label == 'Target Priority Score' for m in at.metric)
          at.button(key='walkthrough_next_0').click().run(timeout=30)
          if at.exception:
              raise SystemExit(at.exception)
          assert at.session_state['walkthrough_step'] == 1
          at.button(key='walkthrough_next_1').click().run(timeout=30)
          if at.exception:
              raise SystemExit(at.exception)
          assert at.session_state['walkthrough_step'] == 2
          assert any(m.label == 'Median GBM Chronos' for m in at.metric)
          at.session_state['walkthrough_open'] = False
          at.run(timeout=30)
          at.button(key='open_walkthrough').click().run(timeout=30)
          if at.exception:
              raise SystemExit(at.exception)
          assert at.session_state['walkthrough_step'] == 0
          print('visual walkthrough smoke passed')
          PY
      - name: Commit app change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add streamlit_app_v5.py
          git commit -m "Replace text-heavy walkthrough with visual product tour"
          git push origin HEAD:ux-visual-walkthrough
