name: Refine Glia Launcher

on:
  push:
    branches:
      - upgrade-glia-ux-tour-context
    paths:
      - scripts/refine_glia_launcher.py
      - .github/workflows/refine_glia_launcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade-glia-ux-tour-context
      - name: Apply launcher patch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/refine_glia_launcher.py
          python -m py_compile glia_interface.py
          git add glia_interface.py
          git commit -m "Attach Ask Glia launcher to panel edge"
          git push origin upgrade-glia-ux-tour-context
