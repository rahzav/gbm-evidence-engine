name: Refine Glia V2 Retry

on:
  push:
    branches:
      - fix-glia-layout-and-answer-quality
    paths:
      - .github/workflows/refine_glia_v2_retry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-glia-layout-and-answer-quality
      - name: Apply Glia refinements
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{label}: expected text not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('app_ui.py', '''from ui_walkthroughs import (\n    maybe_show_initial_tool_walkthrough,\n    render_feature_header,\n    render_tool_tour_launcher,\n)''', '''from ui_walkthroughs import (\n    maybe_show_initial_tool_walkthrough,\n    render_feature_header,\n)''', 'app imports')
          replace_once('app_ui.py', '''render_tool_tour_launcher()\nmaybe_show_initial_tool_walkthrough()''', '''maybe_show_initial_tool_walkthrough()''', 'remove detached tour launcher')
          replace_once('app_ui.py', '''with methods_tab:\n    st.markdown("### Research Scope")''', '''with methods_tab:\n    render_feature_header(\n        "Methods & Data Sources", "methods",\n        "Audit the evidence model, provenance, interpretation boundaries, and source availability.",\n    )\n    st.markdown("### Research Scope")''', 'methods header')

          p = Path('ui_walkthroughs.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('''def _open_glia_from_tour() -> None:\n    st.session_state["glia_force_open_nonce"] = int(st.session_state.get("glia_force_open_nonce", 0)) + 1\n    st.session_state["tool_tour_seen"] = True\n    st.rerun()\n''', '''def _open_glia() -> None:\n    st.session_state["glia_force_open_nonce"] = int(st.session_state.get("glia_force_open_nonce", 0)) + 1\n\n\ndef _open_glia_from_tour() -> None:\n    _open_glia()\n    st.session_state["tool_tour_seen"] = True\n    st.rerun()\n''', 1)
          text = text.replace('''            "Don't show this tour again",\n            key="tool_tour_do_not_show",\n            help="You can reopen the tour anytime from Tool tour.",''', '''            "Don't show this walkthrough again",\n            key="tool_tour_do_not_show",\n            help="This walkthrough remains available at any time through the information button.",''', 1)
          old_launcher = '''def render_tool_tour_launcher() -> None:\n    left, right = st.columns([8.6, 1.4], vertical_alignment="center")\n    with right:\n        if st.button("Tool tour", key="open_tool_tour", type="tertiary", width="stretch"):\n            _launch_tool_tour(manual=True)\n\n\n'''
          if old_launcher not in text:
              raise SystemExit('tour launcher block not found')
          text = text.replace(old_launcher, '', 1)
          old_header = '''def render_feature_header(title: str, feature: str, caption: str | None = None) -> None:\n    """Render a workflow header without per-tab walkthrough controls."""\n    st.markdown(\n        f"<div style='font-size:1.5rem;font-weight:650;line-height:1.25;letter-spacing:-.01em;"\n        f"margin:0;padding:0;'>{title}</div>",\n        unsafe_allow_html=True,\n    )\n    if caption:\n        st.caption(caption)\n\n\n'''
          new_header = '''def render_feature_header(title: str, feature: str, caption: str | None = None) -> None:\n    """Render a cohesive workflow header with Glia in-layout and one global tour entry point."""\n    content_col, glia_col = st.columns([8.8, 1.2], vertical_alignment="center")\n    with content_col:\n        if feature == "gene":\n            title_col, info_col, spacer_col = st.columns([1.75, 0.28, 8.0], vertical_alignment="center")\n            with title_col:\n                st.markdown(\n                    f"<div style='font-size:1.5rem;font-weight:650;line-height:1.25;letter-spacing:-.01em;"\n                    f"margin:0;padding:0;'>{title}</div>",\n                    unsafe_allow_html=True,\n                )\n            with info_col:\n                if st.button(\n                    "",\n                    icon=":material/info:",\n                    key="open_tool_tour_info",\n                    help="Open tool walkthrough",\n                    type="tertiary",\n                ):\n                    _launch_tool_tour(manual=True)\n        else:\n            st.markdown(\n                f"<div style='font-size:1.5rem;font-weight:650;line-height:1.25;letter-spacing:-.01em;"\n                f"margin:0;padding:0;'>{title}</div>",\n                unsafe_allow_html=True,\n            )\n        if caption:\n            st.caption(caption)\n    with glia_col:\n        if st.button("Ask Glia", key=f"open_glia_{feature}", type="primary", width="stretch"):\n            _open_glia()\n\n\n'''
          if old_header not in text:
              raise SystemExit('feature header block not found')
          p.write_text(text.replace(old_header, new_header, 1), encoding='utf-8')

          p = Path('glia_interface.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('  grid-template-columns:40px minmax(0,1fr) 30px 30px 30px;', '  grid-template-columns:40px minmax(0,1fr) 30px 30px 30px 30px;', 1)
          old_launcher_css = '''#glia-launcher {\n  position:fixed; z-index:1000001; right:0; top:48%;\n  transform:translateY(-50%);\n  border:0;\n  background:var(--st-primary-color, #ff4b4b); color:#fff;\n  border-radius:14px 0 0 14px;\n  box-shadow:-6px 8px 24px rgba(0,0,0,.18); padding:10px 14px 10px 10px;\n  display:none; align-items:center; gap:8px; font-weight:760; cursor:pointer;\n  letter-spacing:-.01em;\n}\n#glia-launcher:hover { filter:brightness(.96); padding-right:17px; }\n#glia-launcher.glia-visible { display:flex; }\n'''
          if old_launcher_css not in text:
              raise SystemExit('Glia launcher CSS block not found')
          text = text.replace(old_launcher_css, '''#glia-launcher { display:none !important; }\n#glia-shell.glia-fullscreen {\n  width:100vw; max-width:none; height:100vh;\n  border-left:0; box-shadow:none;\n}\n''', 1)
          text = text.replace('''  #glia-launcher {\n    top:auto; right:16px; bottom:76px; transform:none;\n    border-radius:999px; padding:10px 15px 10px 10px;\n    box-shadow:0 10px 28px rgba(0,0,0,.20);\n  }\n  #glia-launcher:hover { padding-right:15px; }\n''', '', 1)
          text = text.replace('''    open: true,\n    memoryOpen: false,''', '''    open: false,\n    expanded: false,\n    memoryOpen: false,''', 1)
          text = text.replace('    if (runtime.open && window.innerWidth > 980) {', '    if (runtime.open && !runtime.expanded && window.innerWidth > 980) {', 1)
          text = text.replace('''  const setOpen = (open) => {\n    runtime.open = Boolean(open);\n    try { localStorage.setItem(UI_KEY, JSON.stringify({open: runtime.open})); } catch (_) {}\n    render();\n  };''', '''  const setOpen = (open) => {\n    runtime.open = Boolean(open);\n    if (!runtime.open) runtime.expanded = false;\n    try { localStorage.setItem(UI_KEY, JSON.stringify({open: runtime.open})); } catch (_) {}\n    render();\n  };\n  const toggleExpanded = () => {\n    runtime.expanded = !runtime.expanded;\n    runtime.open = true;\n    render();\n  };''', 1)
          text = text.replace('''    shell.classList.toggle("glia-closed", !runtime.open);\n    launcher.classList.toggle("glia-visible", !runtime.open);\n    document.body.classList.toggle("glia-panel-open", runtime.open);\n    syncWorkspaceLayout();''', '''    shell.classList.toggle("glia-closed", !runtime.open);\n    shell.classList.toggle("glia-fullscreen", runtime.open && runtime.expanded);\n    launcher.classList.remove("glia-visible");\n    document.body.classList.toggle("glia-panel-open", runtime.open && !runtime.expanded);\n    document.body.classList.toggle("glia-panel-fullscreen", runtime.open && runtime.expanded);\n    syncWorkspaceLayout();''', 1)
          text = text.replace('''          <button class="glia-icon-btn" id="glia-new-thread" title="New thread" aria-label="New thread">＋</button>\n          <button class="glia-icon-btn" id="glia-memory-toggle" title="Research memory" aria-label="Research memory">◉</button>\n          <button class="glia-icon-btn" id="glia-close" title="Close Glia" aria-label="Close Glia">×</button>''', '''          <button class="glia-icon-btn" id="glia-new-thread" title="New thread" aria-label="New thread">＋</button>\n          <button class="glia-icon-btn" id="glia-expand" title="${runtime.expanded ? "Exit full screen" : "Full screen"}" aria-label="${runtime.expanded ? "Exit full screen" : "Full screen"}">${runtime.expanded ? "↙" : "⛶"}</button>\n          <button class="glia-icon-btn" id="glia-memory-toggle" title="Research memory" aria-label="Research memory">◉</button>\n          <button class="glia-icon-btn" id="glia-close" title="Close Glia" aria-label="Close Glia">×</button>''', 1)
          text = text.replace('''    shell.querySelector("#glia-close").onclick = () => setOpen(false);\n    shell.querySelector("#glia-memory-toggle").onclick = () => { runtime.memoryOpen = !runtime.memoryOpen; render(); };''', '''    shell.querySelector("#glia-close").onclick = () => setOpen(false);\n    shell.querySelector("#glia-expand").onclick = toggleExpanded;\n    shell.querySelector("#glia-memory-toggle").onclick = () => { runtime.memoryOpen = !runtime.memoryOpen; render(); };''', 1)
          text = text.replace('    document.body.classList.remove("glia-panel-open");', '    document.body.classList.remove("glia-panel-open");\n    document.body.classList.remove("glia-panel-fullscreen");', 1)
          text = text.replace('''        "Gene Analysis": [\n            "Explain the strongest finding",\n            "Where does the evidence conflict?",\n            "What experiment would reduce uncertainty most?",\n        ],''', '''        "Gene Analysis": [\n            "What single finding matters most?",\n            "What is the most important contradiction?",\n            "What is the single best next experiment?",\n        ],''', 1)
          text = text.replace('''        "Target Pair Analysis": [\n            "Challenge this target pair",\n            "What evidence supports testing this combination?",\n            "Design the cleanest validation sequence",\n        ],''', '''        "Target Pair Analysis": [\n            "What could invalidate this target pair?",\n            "What is the strongest reason to test this combination?",\n            "What is the cleanest validation sequence?",\n        ],''', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('gbm_evidence_engine/research_agent.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('MAX_OUTPUT_TOKENS = 500', 'MAX_OUTPUT_TOKENS = 320', 1)
          old_rules = '''11. Persistent research memory is continuity context, not scientific evidence.\n    Use it to remember prior questions, investigated targets, and research\n    direction, but retrieve current evidence before making substantive GBM claims.\n\nTOOL USE\n'''
          if old_rules not in text:
              raise SystemExit('agent rules insertion point not found')
          new_rules = '''11. Persistent research memory is continuity context, not scientific evidence.\n    Use it to remember prior questions, investigated targets, and research\n    direction, but retrieve current evidence before making substantive GBM claims.\n12. Do not give a tour of the screen or summarize every evidence layer. Select,\n    rank, challenge, or interpret the evidence needed to answer the actual question.\n13. Lead with the research decision or conclusion. Only repeat a visible metric\n    when it changes the interpretation.\n14. Default to 120 words or fewer unless the researcher explicitly asks for a\n    detailed analysis. Use at most three short paragraphs or five compact bullets.\n15. Every substantive answer should add analytical value beyond restating the\n    workspace: an implication, contradiction, prioritization, falsifiable inference,\n    or discriminating experiment. If the evidence cannot support one, say so.\n16. When asked for the strongest finding, choose exactly one primary finding,\n    explain why it dominates, state the main caveat, and stop.\n17. When asked what to test next, recommend one highest-information experiment\n    by default, including the key readout/control and what outcome would resolve\n    the uncertainty.\n\nTOOL USE\n'''
          text = text.replace(old_rules, new_rules, 1)
          text = text.replace('''- inspect_current_analysis: retrieves analysis already created in the user's\n  current application session, including processed Researcher Data results.\n\nWhen a question can be answered from current session context, inspect that\ncontext instead of asking the user to paste it again.''', '''- inspect_current_analysis: retrieves analysis already created in the user's\n  current application session, including processed Researcher Data results.\n\nFor questions about the current workspace, use inspect_current_analysis first.\nDo not rebuild a dossier that already exists in session unless the current context\nis unavailable or the researcher explicitly asks about a different target. Search\nexternal publications when the question genuinely requires literature beyond the\ncurrent analysis, not as a reflex.\n\nWhen a question can be answered from current session context, inspect that\ncontext instead of asking the user to paste it again.''', 1)
          directive_fn = '''\n\ndef _response_directive(question: str, active_workflow: str = "", selected_quote: str = "") -> str:\n    q = str(question or "").strip().lower()\n    base = (\n        "Answer the research decision, not the interface. Lead with the conclusion; "\n        "use only the minimum evidence needed; avoid a layer-by-layer recap."\n    )\n    if "strongest" in q or "matters most" in q or "most important finding" in q:\n        return base + " Choose exactly one strongest finding, why it matters, and its single biggest caveat. Keep it under 90 words."\n    if "conflict" in q or "contradiction" in q or "disagree" in q:\n        return base + " Identify the single most consequential evidence conflict, explain why it changes confidence, and name the one result that would resolve it."\n    if "experiment" in q or "validate" in q or "test next" in q:\n        return base + " Recommend one highest-information experiment with model/readout, critical control, and the decision-relevant outcome. Do not list alternatives unless asked."\n    if "compare" in q or "which target" in q or "target pair" in q:\n        return base + " Make a clear ranking or decision, then give the decisive evidence and the main reason the ranking could be wrong."\n    if selected_quote:\n        return base + " Interpret the selected text rather than paraphrasing it: state its significance, limitation, and what it changes about the next research decision."\n    if active_workflow == "Researcher Data":\n        return base + " Focus on the processed signal that most changes biological interpretation or validation priority; do not restate the uploaded result summary."\n    return base + " Default to a concise implication plus the most useful next research decision."\n'''
          marker = '\ndef run_agent_turn(\n'
          if marker not in text:
              raise SystemExit('run_agent_turn marker not found')
          text = text.replace(marker, directive_fn + marker, 1)
          text = text.replace('''    continuity_note = json.dumps(memory, default=str, sort_keys=True)[:MAX_MEMORY_CHARS] if memory else "No saved research continuity yet."\n    ui_notes = []''', '''    continuity_note = json.dumps(memory, default=str, sort_keys=True)[:MAX_MEMORY_CHARS] if memory else "No saved research continuity yet."\n    response_directive = _response_directive(question, active_workflow, selected_quote)\n    ui_notes = []''', 1)
          text = text.replace('''                + "\\nPersistent research continuity: "\n                + continuity_note\n            ),''', '''                + "\\nPersistent research continuity: "\n                + continuity_note\n                + "\\nResponse directive: "\n                + response_directive\n            ),''', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('tests/test_research_agent.py')
          p.write_text(p.read_text(encoding='utf-8').replace('assert kwargs["max_output_tokens"] == 500', 'assert kwargs["max_output_tokens"] == 320', 1), encoding='utf-8')

          p = Path('tests/test_glia_interface.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('''        "glia-panel-open",\n        "Research memory",''', '''        "glia-panel-open",\n        "glia-fullscreen",\n        "glia-expand",\n        "Research memory",''', 1)
          text = text.replace('''    assert 'st.button("Ask Glia"' in source\n''', '''    assert 'st.button("Ask Glia"' in source\n    assert 'open_tool_tour_info' in source\n    assert "Don't show this walkthrough again" in source\n''', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('.github/workflows/ci.yml')
          text = p.read_text(encoding='utf-8')
          text = text.replace('''          assert 'render_tool_tour_launcher()' in ui\n          assert 'glia_force_open_nonce' in walkthroughs''', '''          assert 'render_tool_tour_launcher()' not in ui\n          assert 'open_tool_tour_info' in walkthroughs\n          assert "Don't show this walkthrough again" in walkthroughs\n          assert 'glia_force_open_nonce' in walkthroughs''', 1)
          text = text.replace('''          for required in ('Ask Glia', 'gliaGlyph', 'force_open_nonce', 'localStorage', 'st.components.v2.component', 'glia-panel-open', 'Research memory'):''', '''          for required in ('Ask Glia', 'gliaGlyph', 'force_open_nonce', 'localStorage', 'st.components.v2.component', 'glia-panel-open', 'glia-fullscreen', 'Research memory'):''', 1)
          text = text.replace('''          assert 'persistent_memory' in agent\n          assert 'store": False' in agent''', '''          assert 'persistent_memory' in agent\n          assert 'def _response_directive' in agent\n          assert 'MAX_OUTPUT_TOKENS = 320' in agent\n          assert 'store": False' in agent''', 1)
          p.write_text(text, encoding='utf-8')
          PY
          python -m py_compile app_ui.py ui_walkthroughs.py glia_interface.py gbm_evidence_engine/research_agent.py
          git add app_ui.py ui_walkthroughs.py glia_interface.py gbm_evidence_engine/research_agent.py tests/test_research_agent.py tests/test_glia_interface.py .github/workflows/ci.yml
          git commit -m "Refine Glia layout, fullscreen, and answer quality"
          git push origin fix-glia-layout-and-answer-quality
