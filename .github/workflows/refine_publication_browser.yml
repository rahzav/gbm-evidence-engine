name: Refine Publication Browser

on:
  push:
    branches: [publication-browser-and-citation-fix]
    paths:
      - .github/workflows/refine_publication_browser.yml
      - scripts/refine_publication_browser.py

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publication-browser-and-citation-fix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/refine_publication_browser.py
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_ui.py
          git commit -m "Reset publication search when disease context changes"
          git push origin publication-browser-and-citation-fix
