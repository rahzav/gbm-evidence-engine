name: Refine walkthrough

on:
  push:
    branches: [ux-walkthrough-interpretation]
    paths:
      - scripts/refine_walkthrough.py
      - .github/workflows/refine_walkthrough.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-walkthrough-interpretation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply walkthrough refinement
        run: python scripts/refine_walkthrough.py
      - name: Validate syntax and walkthrough contract
        run: |
          python -m py_compile streamlit_app_v5.py
          python - <<'PY'
          from pathlib import Path
          text = Path('streamlit_app_v5.py').read_text()
          required = [
              'Target Priority Score and Evidence Coverage',
              'Functional Dependency and Spatial Expression',
              'Human Validation: CGGA and GLASS',
              'Evidence Record, Evidence Gaps, Validation Studies, and Comparison',
              '[3.45, 0.28, 8.27]',
              'No B3DB match means permeability evidence was not found',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'Missing walkthrough elements: {missing}')
          banned = [
              'Start with the research question',
              'Overview: decide what deserves attention',
              'How to use it',
              'Prioritize studies that address',
              'A typical workflow is',
          ]
          found = [x for x in banned if x in text]
          if found:
              raise SystemExit(f'Old/recommendation-oriented tutorial copy remains: {found}')
          PY
      - name: Install app dependencies
        run: pip install -r requirements.txt
      - name: Streamlit navigation smoke
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file('streamlit_app.py').run(timeout=30)
          if at.exception:
              raise SystemExit(at.exception)
          assert at.session_state['walkthrough_open'] is True
          assert at.session_state['walkthrough_step'] == 0
          at.button(key='walkthrough_next_0').click().run(timeout=30)
          if at.exception:
              raise SystemExit(at.exception)
          assert at.session_state['walkthrough_step'] == 1
          at.session_state['walkthrough_open'] = False
          at.run(timeout=30)
          at.button(key='open_walkthrough').click().run(timeout=30)
          if at.exception:
              raise SystemExit(at.exception)
          assert at.session_state['walkthrough_open'] is True
          assert at.session_state['walkthrough_step'] == 0
          print('walkthrough smoke passed')
          PY
      - name: Commit app change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add streamlit_app_v5.py
          git commit -m "Refocus walkthrough on evidence interpretation"
          git push origin HEAD:ux-walkthrough-interpretation
