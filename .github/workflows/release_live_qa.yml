name: Release Live QA

on:
  push:
    branches: [final-production-integration]
    paths:
      - .github/workflows/release_live_qa.yml

jobs:
  integrated-live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-production-integration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run integrated production workflows
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from gbm_evidence_engine.research_intelligence_v7_prod import (
              SOFTWARE_VERSION,
              analyze_researcher_signature,
              build_research_profile,
              evaluate_gene_pair,
              rank_gene_list,
          )

          assert SOFTWARE_VERSION == '7.0.0'

          profile = build_research_profile('EGFR')
          payload = profile.to_dict()
          assert payload.get('software_version') == '7.0.0', payload.get('software_version')
          assert profile.score.evidence_coverage_pct > 0
          assert profile.live.get('overall_evidence_confidence', {}).get('score') is not None
          assert profile.live.get('gbmap_cell_state', {}).get('ok'), profile.live.get('gbmap_cell_state')
          papers = profile.live.get('literature', {}).get('top_papers') or []
          if papers:
              assert all(p.get('title') for p in papers)
              assert any(p.get('url') for p in papers)
          print('GENE_ANALYSIS_OK', profile.gene, profile.score.overall, profile.score.evidence_coverage_pct)

          pair = evaluate_gene_pair('EGFR', 'CDK4')
          assert pair.get('software_version') == '7.0.0'
          assert pair.get('combination_rationale_score') is not None, pair
          assert 'malignant_cell_state_complementarity' in pair.get('components', {})
          assert pair.get('pair_evidence_confidence', {}).get('score') is not None
          print('PAIR_ANALYSIS_OK', pair['combination_rationale_score'])

          genes = ['EGFR','STAT3','SOX2','CDK6','OLIG2','GFAP','CDKN1A','BAX']
          effects = [2.4,1.6,1.4,1.2,-1.0,-1.3,-1.7,-2.0]
          p_values = [1e-4,1e-3,2e-3,0.01,0.02,0.003,0.001,1e-4]
          fdr_values = [0.002,0.01,0.02,0.04,0.05,0.02,0.01,0.002]
          signature = analyze_researcher_signature(
              genes,
              effects,
              p_values=p_values,
              fdr_values=fdr_values,
              profile_limit=1,
              l1000_results=5,
          )
          assert signature.get('ok'), signature
          assert signature.get('software_version') == '7.0.0'
          assert signature.get('top_genes_profiled'), signature
          print('RESEARCHER_DATA_OK', signature.get('n_input_genes'), signature.get('n_statistically_supported'))

          batch = rank_gene_list(['EGFR', 'RPL3'], max_workers=1)
          assert len(batch) == 2
          assert all(p.to_dict().get('software_version') == '7.0.0' for p in batch)
          print('GENE_SET_OK', [(p.gene, p.score.overall) for p in batch])

          try:
              evaluate_gene_pair('EGFR', 'EGFR')
          except ValueError:
              print('INVALID_PAIR_OK')
          else:
              raise AssertionError('Same-gene pair did not fail')
          PY
      - name: API request validation
        run: |
          PYTHONPATH=. python - <<'PY'
          from fastapi.testclient import TestClient
          from api.app import app

          client = TestClient(app)
          assert client.get('/health').json()['version'] == '7.0.0'
          assert client.post('/combination', json={'gene_a':'EGFR','gene_b':'EGFR'}).status_code == 400
          assert client.post('/signature', json={
              'genes':['A','B','C','D','E','F'],
              'values':[1,2,3,4,5,6],
              'p_values':[0.1],
          }).status_code == 400
          assert client.post('/profile', json={'gene':''}).status_code == 422
          print('API_VALIDATION_OK')
          PY
      - name: Streamlit startup and walkthrough QA
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          at = AppTest.from_file('streamlit_app.py', default_timeout=90).run(timeout=45)
          assert not list(at.exception), list(at.exception)
          assert any(b.label == 'Build dossier' for b in at.button)
          assert at.session_state['walkthrough_open'] is True
          print('STREAMLIT_STARTUP_OK')
          PY
