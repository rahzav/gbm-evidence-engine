name: Remove Publication Filter Counts

on:
  push:
    branches: [publication-browser-and-citation-fix]
    paths:
      - .github/workflows/remove_publication_filter_counts.yml
      - scripts/remove_publication_filter_counts.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publication-browser-and-citation-fix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/remove_publication_filter_counts.py
      - name: Commit UI cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_ui.py
          git commit -m "Use clean disease-context filter labels"
          git push origin publication-browser-and-citation-fix
