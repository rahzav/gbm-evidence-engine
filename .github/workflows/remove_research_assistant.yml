name: Remove Research Assistant

on:
  push:
    branches:
      - remove-research-assistant
    paths:
      - .github/workflows/remove_research_assistant.yml

permissions:
  contents: write

jobs:
  remove-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-research-assistant
          fetch-depth: 0
      - name: Restore pre-agent product files
        run: |
          git checkout 5ed711a27dcbdcbd4997afa41d95ef78844044a3 -- app_ui.py README.md docs/RESEARCHER_DATA_HANDLING.md requirements.txt
          git rm -f .env.example gbm_evidence_engine/research_agent.py tests/test_research_agent.py
      - name: Validate removal
        run: |
          python - <<'PY'
          from pathlib import Path
          ui = Path('app_ui.py').read_text(encoding='utf-8')
          req = Path('requirements.txt').read_text(encoding='utf-8')
          assert 'Research Assistant' not in ui
          assert 'research_agent' not in ui
          assert 'openai' not in req.lower()
          assert not Path('gbm_evidence_engine/research_agent.py').exists()
          assert not Path('tests/test_research_agent.py').exists()
          assert not Path('.env.example').exists()
          print('Research Assistant removal validated')
          PY
      - name: Commit removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_ui.py README.md docs/RESEARCHER_DATA_HANDLING.md requirements.txt
          git commit -m "Remove Research Assistant feature"
          git push origin remove-research-assistant
