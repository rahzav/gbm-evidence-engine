name: Restore Groq Research Assistant

on:
  push:
    branches: [groq-research-assistant]
    paths:
      - '.github/workflows/restore_groq_agent.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: groq-research-assistant
          fetch-depth: 0
      - name: Restore agent and adapt to Groq
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Restore the validated Research Assistant implementation removed in PR #24.
          git revert --no-edit 720e1b473c9b862f55e01c20125331cc7ec8a50c

          python - <<'PY'
          from pathlib import Path

          # Deployment configuration
          Path('.env.example').write_text(
              '# Optional Research Assistant configuration\n'
              'GROQ_API_KEY=\n'
              'GROQ_MODEL=openai/gpt-oss-120b\n',
              encoding='utf-8',
          )

          # Provider + free-tier efficiency changes in the agent orchestration layer.
          p = Path('gbm_evidence_engine/research_agent.py')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'DEFAULT_MODEL = "gpt-5.4"': 'DEFAULT_MODEL = "openai/gpt-oss-120b"\nGROQ_BASE_URL = "https://api.groq.com/openai/v1"',
              'MAX_TOOL_ROUNDS = 6': 'MAX_TOOL_ROUNDS = 4',
              'MAX_EVIDENCE_RECORDS = 60': 'MAX_EVIDENCE_RECORDS = 12',
              'MAX_HISTORY_MESSAGES = 8': 'MAX_HISTORY_MESSAGES = 3',
              'os.getenv("OPENAI_MODEL")': 'os.getenv("GROQ_MODEL")',
              'os.getenv("OPENAI_API_KEY")': 'os.getenv("GROQ_API_KEY")',
              'content[:12000]': 'content[:5000]',
              '"max_output_tokens": 2200': '"max_output_tokens": 900',
              'if model.startswith("gpt-5"):\n        kwargs["reasoning"] = {"effort": "medium"}': 'if model.startswith("openai/gpt-oss-"):\n        kwargs["reasoning"] = {"effort": "low"}',
              'raise ResearchAgentError("The OpenAI client dependency is unavailable.")': 'raise ResearchAgentError("The API client dependency is unavailable.")',
              'client = OpenAI(api_key=key)': 'client = OpenAI(api_key=key, base_url=GROQ_BASE_URL)',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected agent text: {old}')
              s = s.replace(old, new)

          old = '    except Exception as exc:\n        raise ResearchAgentError(f"Research Assistant request failed: {exc}") from exc\n\n    text = str(getattr(response, "output_text", None) or "").strip()'
          new = '''    except Exception as exc:\n        status_code = getattr(exc, "status_code", None)\n        message = str(exc)\n        lowered = message.lower()\n        if status_code == 429 or "rate limit" in lowered or "too many requests" in lowered:\n            raise ResearchAgentError(\n                "Research Assistant is temporarily at capacity on the shared Groq free tier. Please try again later."\n            ) from exc\n        if status_code in {401, 403}:\n            raise ResearchAgentError(\n                "Research Assistant could not authenticate with Groq. Check the deployment API key."\n            ) from exc\n        raise ResearchAgentError(f"Research Assistant request failed: {exc}") from exc\n\n    text = str(getattr(response, "output_text", None) or "").strip()'''
          if old not in s:
              raise SystemExit('missing provider error block')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          # Streamlit integration now reads only the Groq deployment secret/model.
          p = Path('app_ui.py')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'sent to OpenAI. Raw Researcher Data tables are not passed to the assistant.': 'processed by Groq. Raw Researcher Data tables are not passed to the assistant.',
              '_agent_secret("OPENAI_API_KEY")': '_agent_secret("GROQ_API_KEY")',
              '_agent_secret("OPENAI_MODEL")': '_agent_secret("GROQ_MODEL")',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected UI text: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          # Documentation.
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          old = 'The assistant uses the OpenAI Responses API with function calling. Configure `OPENAI_API_KEY`; `OPENAI_MODEL` is optional and defaults to `gpt-5.4`.'
          new = 'The assistant uses Groq through its OpenAI-compatible Responses API with function calling. Configure `GROQ_API_KEY`; `GROQ_MODEL` is optional and defaults to `openai/gpt-oss-120b`. The application handles Groq rate-limit responses without falling back to paid usage.'
          if old not in s:
              raise SystemExit('missing README provider paragraph')
          p.write_text(s.replace(old, new), encoding='utf-8')

          p = Path('docs/RESEARCHER_DATA_HANDLING.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('configured OpenAI API deployment', 'configured Groq API deployment')
          s = s.replace('OpenAI API deployment', 'Groq API deployment')
          p.write_text(s, encoding='utf-8')

          # Dedicated tests stay deterministic and provider-independent, but use the production default model family.
          p = Path('tests/test_research_agent.py')
          s = p.read_text(encoding='utf-8').replace('model="gpt-5.4"', 'model="openai/gpt-oss-120b"')
          p.write_text(s, encoding='utf-8')

          # CI asserts the Groq-only deployment path.
          p = Path('.github/workflows/ci.yml')
          s = p.read_text(encoding='utf-8')
          needle = "          assert 'store\": False' in agent\n"
          addition = (
              needle
              + "          assert 'https://api.groq.com/openai/v1' in agent\n"
              + "          assert 'GROQ_API_KEY' in ui\n"
              + "          assert 'OPENAI_API_KEY' not in ui\n"
          )
          if needle not in s:
              raise SystemExit('missing CI agent assertion')
          p.write_text(s.replace(needle, addition, 1), encoding='utf-8')
          PY

          python -m py_compile gbm_evidence_engine/research_agent.py app_ui.py
          PYTHONPATH=. python tests/test_research_agent.py

          git add .env.example .github/workflows/ci.yml README.md app_ui.py docs/RESEARCHER_DATA_HANDLING.md gbm_evidence_engine/research_agent.py requirements.txt tests/test_research_agent.py
          git commit -m "Restore Research Assistant with Groq free-tier backend"
          git push origin groq-research-assistant
