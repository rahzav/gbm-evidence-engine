name: Runtime Diagnostic

on:
  push:
    branches: [runtime-diagnostic]

jobs:
  streamlit-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Import deployed entrypoint
        run: |
          python - <<'PY'
          import streamlit_app
          print('ENTRYPOINT_IMPORT_OK')
          PY
      - name: Start Streamlit and probe health
        run: |
          streamlit run streamlit_app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          pid=$!
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              echo
              echo STREAMLIT_HEALTH_OK
              kill $pid || true
              exit 0
            fi
            sleep 1
          done
          echo '--- streamlit log ---'
          cat /tmp/streamlit.log
          kill $pid || true
          exit 1
