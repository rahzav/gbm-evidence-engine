name: Apply technical help and Enter-submit UX

on:
  push:
    branches: [ux-help-enter-submit]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-help-enter-submit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_ux_help.py
      - name: Validate syntax and requested UX
        run: |
          python -m py_compile streamlit_app.py streamlit_app_v5.py
          python - <<'PY'
          from pathlib import Path
          text = Path('streamlit_app_v5.py').read_text()
          assert 'st.form("gene_analysis_form"' in text
          assert 'st.form_submit_button(' in text
          assert '"Analyze"' in text
          assert 'Build Research Profile' not in text
          assert 'help=HELP["target_priority_score"]' in text
          assert 'help=HELP["chronos"]' in text
          assert 'help=HELP["pooled_hr"]' in text
          assert 'help=HELP["bbb"]' in text
          assert text.count('help=HELP[') >= 35
          print('UX_HELP_VALIDATION_OK', text.count('help=HELP['))
          PY
      - name: Commit app-only change and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ux_help_enter_patch.yml scripts/patch_ux_help.py
          git add streamlit_app_v5.py
          git commit -m "Add technical help and Enter-to-analyze UX"
          git push origin HEAD:ux-help-enter-submit
