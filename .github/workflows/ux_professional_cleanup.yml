name: Apply professional UX cleanup

on:
  push:
    branches: [ux-professional-copy-cleanup]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-professional-copy-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply cleanup
        run: python scripts/ux_professional_cleanup.py
      - name: Validate UI source
        run: |
          python -m py_compile streamlit_app_v5.py
          python - <<'PY'
          from pathlib import Path
          text = Path('streamlit_app_v5.py').read_text()
          assert 'st.form_submit_button(\n                "Analyze"' in text
          assert 'help=HELP["gene_symbol"]' not in text
          assert 'Start with Overview.' not in text
          assert 'Tool-generated recommendations are kept out of this workspace.' not in text
          assert 'Research prioritization only; not a measure of causality or clinical benefit.' in text
          assert 'help=HELP["tcga_mutation"]' not in text
          assert 'help=HELP["chronos"]' in text
          assert 'help=HELP["pooled_hr"]' in text
          assert 'retains the validated V4 evidence model' not in text
          assert 'V5 adds canonical gene identity' not in text
          print('UX source checks passed')
          PY
      - name: Commit cleaned app only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/ux_professional_cleanup.py .github/workflows/ux_professional_cleanup.yml
          git add streamlit_app_v5.py
          git commit -m "Refine researcher-facing copy and help"
          git push origin HEAD:ux-professional-copy-cleanup
