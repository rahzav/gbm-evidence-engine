name: GBM V2 upgrade

on:
  push:
    paths:
      - '_upgrade/part06.b64'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check upgrade payload
        id: payload
        run: |
          if [ -f _upgrade/part06.b64 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply upgrade
        if: steps.payload.outputs.run == 'true'
        run: |
          cat _upgrade/part*.b64 | base64 -d > /tmp/upgrade.tar.xz
          echo "c04aaf29f46bc3ca9654d86492dbd1018a29c5bad1c0f5874f2eb58d1f8354c6  /tmp/upgrade.tar.xz" | sha256sum -c -
          tar -xJf /tmp/upgrade.tar.xz -C .

      - uses: actions/setup-python@v5
        if: steps.payload.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Install test dependencies
        if: steps.payload.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy

      - name: Run unit tests
        if: steps.payload.outputs.run == 'true'
        run: |
          PYTHONPATH=. python tests/test_survival.py
          PYTHONPATH=. python tests/test_dependency.py
          PYTHONPATH=. python tests/test_evidence_model.py
          PYTHONPATH=. python tests/test_grounding_validator.py
          PYTHONPATH=. python tests/test_research_intelligence.py

      - name: Live public-source smoke test
        if: steps.payload.outputs.run == 'true'
        run: PYTHONPATH=. python scripts/live_smoke_test.py

      - name: Commit validated V2
        if: steps.payload.outputs.run == 'true'
        run: |
          rm -rf _upgrade
          rm -f .github/workflows/v2_upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upgrade to live-first GBM research intelligence"
          git push
