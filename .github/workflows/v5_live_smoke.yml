name: V5 Live Source Smoke

on:
  push:
    branches: [v5-research-capacity]

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: pip install pandas
      - name: Verify new live research sources
        run: |
          PYTHONPATH=. python - <<'PY'
          from gbm_evidence_engine.connectors import mygene, hpa, stringdb, b3db_live

          identity = mygene.resolve_gene('ERBB1')
          print('MYGENE', identity)
          assert identity.get('ok') and identity.get('symbol') == 'EGFR'

          tissue = hpa.get_gene_context('EGFR')
          print('HPA', tissue)
          assert tissue.get('ok')

          network = stringdb.get_network_context('EGFR', limit=5)
          print('STRING', network)
          assert network.get('ok') and len(network.get('partners') or []) >= 1

          bbb = b3db_live.lookup_candidates(['temozolomide', 'erlotinib', 'gefitinib', 'osimertinib'])
          print('B3DB', bbb)
          assert bbb.get('ok')
          PY
