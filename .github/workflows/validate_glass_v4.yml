name: Validate strict GLASS V4

on:
  push:
    branches: [glass-gbm-specific]
    paths: ['.github/workflows/validate_glass_v4.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: glass-gbm-specific
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Switch Streamlit to V4
        run: |
          sed -i 's/from gbm_evidence_engine.research_intelligence_v3 import/from gbm_evidence_engine.research_intelligence_v4 import/' streamlit_app.py
          grep -q 'research_intelligence_v4' streamlit_app.py
      - name: Install deterministic test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy
      - name: Compile research stack
        run: |
          python -m py_compile \
            gbm_evidence_engine/connectors/glass.py \
            gbm_evidence_engine/research_intelligence_v4.py \
            streamlit_app.py
      - name: Run full deterministic tests
        run: |
          PYTHONPATH=. python tests/test_survival.py
          PYTHONPATH=. python tests/test_dependency.py
          PYTHONPATH=. python tests/test_evidence_model.py
          PYTHONPATH=. python tests/test_grounding_validator.py
          PYTHONPATH=. python tests/test_research_intelligence.py
          PYTHONPATH=. python tests/test_glass_gbm_specific.py
      - name: Commit validated V4
        run: |
          rm -f .github/workflows/validate_glass_v4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Enable GBM-specific GLASS longitudinal intelligence'
          git push origin glass-gbm-specific
