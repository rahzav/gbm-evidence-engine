name: Validate research-grade V3

on:
  push:
    branches: [research-grade-cohorts]
    paths: ['.github/workflows/validate_v3.yml']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy
      - name: Syntax and deterministic tests
        run: |
          python -m py_compile \
            gbm_evidence_engine/connectors/base.py \
            gbm_evidence_engine/connectors/depmap.py \
            gbm_evidence_engine/connectors/ivygap.py \
            gbm_evidence_engine/connectors/cgga.py \
            gbm_evidence_engine/connectors/glass.py \
            gbm_evidence_engine/research_intelligence_v3.py \
            streamlit_app.py api/app.py
          PYTHONPATH=. python tests/test_survival.py
          PYTHONPATH=. python tests/test_dependency.py
          PYTHONPATH=. python tests/test_evidence_model.py
          PYTHONPATH=. python tests/test_grounding_validator.py
          PYTHONPATH=. python tests/test_research_intelligence.py
          PYTHONPATH=. python tests/test_research_intelligence_v3.py
      - name: Live EGFR multi-source validation
        run: |
          PYTHONPATH=. python - <<'PY'
          import time
          from gbm_evidence_engine.research_intelligence_v3 import build_research_profile
          started=time.time()
          p=build_research_profile('EGFR')
          print('elapsed_seconds',round(time.time()-started,1))
          print('score',p.score.overall,'coverage',p.score.evidence_coverage_pct)
          print('sources',p.source_status)
          dep=p.live['depmap']; ivy=p.live['ivy_gap']; cgg=p.live['cgga']; gla=p.live['glass']
          print('depmap', {k:dep.get(k) for k in ['ok','n_gbm','median_effect_gbm','median_effect_other','median_selectivity_delta','p_value','pan_essential']})
          print('ivy', {k:ivy.get(k) for k in ['ok','n_samples','top_zone','median_range','p_value']})
          print('cgga usable',cgg.get('n_usable_cohorts'),'meta',cgg.get('meta_analysis'))
          for row in cgg.get('cohorts',[]): print('cgga cohort',row)
          print('glass', {k:gla.get(k) for k in ['ok','status','entity_id','error']})
          for source in ['cBioPortal / TCGA-GBM','Open Targets','Europe PMC','ClinicalTrials.gov']:
              assert p.source_status[source] == 'live', (source,p.source_status[source])
          assert dep.get('ok'), dep
          assert dep.get('n_gbm',0) >= 3, dep
          assert ivy.get('ok'), ivy
          assert ivy.get('n_samples',0) >= 200, ivy
          assert cgg.get('ok'), cgg
          assert cgg.get('n_usable_cohorts') == 2, cgg
          assert cgg.get('meta_analysis') is not None, cgg
          assert gla.get('status') == 'credentials_required', gla
          assert p.score.evidence_coverage_pct == 100.0, p.score.to_dict()
          print('LIVE V3 VALIDATION PASSED')
          PY
